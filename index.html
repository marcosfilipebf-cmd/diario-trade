<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Diário Zella</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0c;color:#e8eaed;font-family:system-ui,-apple-system,sans-serif;padding:0}
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:#0b0e11;border-right:1px solid #1a1f26;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.sb-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#08120b}
.sb-acct{margin:0 12px 14px;background:#12161b;border:1px solid #1a1f26;border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px;cursor:pointer}
.sb-sec{color:#4b5563;font-size:9px;font-weight:800;letter-spacing:1.1px;padding:12px 18px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#9aa3ad;cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent}
.sb-item:hover{color:#e8eaed;background:#12161b}
.sb-item.active{color:#22c55e;background:#22c55e12;border-left-color:#22c55e;font-weight:600}
.sb-badge{margin-left:auto;background:#f59e0b22;color:#f59e0b;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.page-head{margin-bottom:20px}
.page-title{font-size:21px;font-weight:700;display:flex;align-items:center;gap:9px}
.page-sub{color:#6b7280;font-size:13px;margin-top:3px}
.sb-toggle{display:none}
@media(max-width:860px){
 .sidebar{position:fixed;left:0;top:0;z-index:400;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #000}
 .sidebar.open{transform:none}
 .main{padding:14px 14px 60px}
 .sb-toggle{display:flex;align-items:center;gap:9px;margin-bottom:14px}
}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:4px}
input::placeholder,textarea::placeholder{color:#334155}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #334155;border-top:2px solid #22c55e;border-radius:50%;animation:spin 0.8s linear infinite}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.card{background:#0e1216;border-radius:12px;border:1px solid #1a1f26;padding:16px;margin-bottom:12px}
.btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:8px;color:#fff;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary:disabled{background:#1e3a5f;cursor:not-allowed;opacity:0.5}
.btn-ghost{background:#12161b;border:1px solid #1e242c;border-radius:8px;color:#9aa3ad;padding:8px 14px;cursor:pointer;font-size:12px}
.btn-danger{background:none;border:none;color:#ef4444;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px}
.btn-danger:hover{background:#ef444422}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#475569;padding:11px 18px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.tab.active{border-bottom-color:#22c55e;color:#22c55e}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:#0b0e11;border:1px solid #1e242c;border-radius:8px;color:#f1f5f9;font-size:13px;padding:8px 10px;outline:none;width:100%;font-family:inherit}
select option{background:#0d1526}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.label{color:#64748b;font-size:11px;display:block;margin-bottom:4px}
.section-label{font-size:10px;font-weight:700;letter-spacing:0.8px;margin-bottom:10px}
.trade-card{background:#0e1216;border-radius:12px;margin-bottom:8px;overflow:hidden}
.trade-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap;gap:8px;cursor:pointer}
.trade-detail{padding:12px 16px;border-top:1px solid #1e3a5f;display:grid;gap:10px}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle-track{width:36px;height:20px;border-radius:10px;position:relative;transition:background 0.2s;flex-shrink:0;cursor:pointer}
.toggle-thumb{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left 0.2s}
.alert{background:#2d0606;border:1px solid #ef4444;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.stats-bar{background:#0e1216;border:1px solid #1a1f26;border-radius:12px;padding:13px 18px;display:flex;gap:26px;overflow-x:auto;margin-bottom:16px}
.metric{background:#0e1216;border-radius:10px;padding:13px 15px;border:1px solid #1a1f26}
.img-preview{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid #1e3a5f}
.capital-input{background:#060d1f;border:1px solid #22c55e;border-radius:8px;color:#22c55e;font-size:14px;font-weight:700;padding:4px 8px;width:110px;outline:none;text-align:center}
.tag-item{display:inline-flex;align-items:center;gap:6px;background:#1e3a5f;border-radius:20px;padding:4px 10px;font-size:12px;color:#94a3b8;margin:3px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
.journal-switch{display:flex;gap:4px;background:#0d1526;border-radius:10px;padding:4px;border:1px solid #1e3a5f}
.journal-btn{background:none;border:none;border-radius:7px;color:#475569;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;transition:all 0.15s;white-space:nowrap}
.journal-btn.active{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.chip{border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;border:1px solid;transition:all 0.15s;white-space:nowrap}
.filter-box{background:#060d1f;border-radius:10px;padding:14px;border:1px solid}
.check-row{display:flex;align-items:center;gap:9px;cursor:pointer;padding:6px 0}
.checkbox{width:19px;height:19px;border-radius:5px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;transition:all 0.15s}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(0.6)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:6px}
.cal-cell{background:#0e1216;border:1px solid #1a1f26;border-radius:9px;min-height:86px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;cursor:default}
.cal-cell.win{border-color:#22c55e66;background:#052e1655}
.cal-cell.loss{border-color:#ef444466;background:#2d060655}
.cal-cell.be{border-color:#f59e0b55}
.cal-cell.empty{background:transparent;border:none}
.cal-week{background:#12161b;border:1px solid #1a1f26;border-radius:9px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
table.prev{width:100%;border-collapse:collapse;font-size:11px}
table.prev th{color:#475569;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid #1e3a5f;white-space:nowrap}
table.prev td{padding:6px 8px;border-bottom:1px solid #0f1b33;color:#cbd5e1;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:#000000cc;z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal{background:#0e1216;border:1px solid #1a1f26;border-radius:14px;max-width:1000px;width:100%;padding:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ══════════════════════════════════════════════════════════════════
// JOURNAL CONFIGS
// ══════════════════════════════════════════════════════════════════
const JOURNALS={
  forex:{
    name:'Forex',icon:'💱',currency:'$',subtitle:'Exness Zero · TradingView · M2/M5',
    mode:'setup',
    defaults:{
      capital:200,riskPct:0.5,maxLossPct:3,maxConsec:3,
      pairs:['US30','EURUSD','GBPUSD','BTC','US500','USOIL','XAGUSD','GBPJPY','NASDAQ','XAUUSD','AUDUSD'],
      paused:['AUDUSD','XAUUSD'],
      setups:['Pivot','Fibo'],
      results:['Win','Loss','BE','BE e depois andou'],
      timeframes:['M2','M5'],
      sessions:['Manhã','Tarde','Noite','Madrugada'],
      regions:[],triggers:[],filters:[],confluences:[],
      riskMode:'pct',fixedStop:null,valorPonto:null,
    },
    hasFibo:true,
  },
  win:{
    name:'Mini Índice',icon:'📊',currency:'R$',subtitle:'Mesa proprietária · WIN · Liquidez + Pivô M1',
    mode:'liquidity',
    defaults:{
      capital:6000,riskPct:5,maxLossPct:10,maxConsec:2,
      pairs:['WIN'],paused:[],
      setups:[],
      results:['Win','Loss','BE','BE e depois andou'],
      timeframes:['M1','M2','M5','M15'],
      sessions:['Abertura','Manhã','Tarde','Fechamento'],
      regions:['Consumo de liquidez','Captura de liquidez','Região de Fibo (50-61%)'],
      triggers:['Pivô oculto','Pivô revelado'],
      filters:['Preço esticado','Frequência baixa','Amplitude alta','Indicador barato/caro'],
      confluences:['POC','VWAP semanal','VWAP diária','VWAP mensal','Troca de polaridade','Fluxo a favor','Fluxo contra','Absorção','Agressão'],
      riskMode:'pct',fixedStop:null,valorPonto:0.20,
    },
    hasFibo:false,
  },
};

const EMOTS=['Neutro','Confiante','Ansioso','Com medo','Empolgado','Frustrado','Impaciente','Calmo'];
const FIBO_LVL=['50','61.8','73.6'];
const FIBO_CONF=['MM20','MM50','LT','PB LT','CHoCH'];
const RETEST=['Acima do nível','Tocou','Quebrou e voltou','Invalidou'];
const LT_STR=['Forte','Fraco'];
const CTXS=['Tendência','Lateral','Pós-notícia'];
const TGTS=['0.382','0 (alvo)','Rompeu','Saiu antes'];
const WEEKDAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const RC_DEFAULT={Win:'#22c55e',Loss:'#ef4444',BE:'#f59e0b','BE e depois andou':'#f97316'};
const EC={Neutro:'#64748b',Confiante:'#22c55e',Ansioso:'#f59e0b','Com medo':'#ef4444',Empolgado:'#22c55e',Frustrado:'#ef4444',Impaciente:'#f59e0b',Calmo:'#22c55e'};

// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
let activeJournal='win';
let journals={};

function initJournal(key){
  const d=JOURNALS[key].defaults;
  return {trades:[],capital:d.capital,pairs:[...d.pairs],paused:[...d.paused],setups:[...d.setups],
    results:[...d.results],timeframes:[...d.timeframes],sessions:[...d.sessions],
    regions:[...d.regions],triggers:[...d.triggers],filters:[...d.filters],confluences:[...d.confluences],
    maxConsec:d.maxConsec,maxLossPct:d.maxLossPct,riskPct:d.riskPct,riskMode:d.riskMode,fixedStop:d.fixedStop,valorPonto:d.valorPonto};
}

const _now=new Date();
let imp=null;
let ui={tab:'journal',sbOpen:false,eqEscala:'trade',eqPeriodo:'',calView:'mes',calMonth:_now.getMonth(),calYear:_now.getFullYear(),showForm:false,
  filter:{setup:'',resultado:'',par:'',periodo:'',diaSemana:'',janela:'',revisar:'',dataPreset:'',dataIni:'',dataFim:'',mesRef:'',regioes:[],gatilhos:[],confluencias:[],filtros:[],filtrosOk:''},
  formMode:'manual',formTxt:'',formImg:null,formData:null,formLoading:false,formErr:'',openTrades:{},_editIdx:null};

function J(){return journals[activeJournal];}
function CFG(){return JOURNALS[activeJournal];}
function isLiq(){return CFG().mode==='liquidity';}

function emptyForm(){
  return {par:'',setup:'',regioes:[],gatilhos:[],direcao:'',resultado:'',pnl:'',rr_realizado:'',
  filtros:[],confluencias:[],
  hora_entrada:'',hora_saida:'',janela:'',qtd:'',preco_entrada:'',preco_saida:'',pontos_resultado:null,importado:false,revisado:false,pontos_stop:'',pontos_gain:'',saiu_parcial:false,parcial_pct:'',parciais:[],
  fibo_nivel:'',timeframe:'',sessao:'',emocao:'',seguiu_regras:true,moveu_be_cedo:false,tinha_confluencia:true,lt_rompimento_forte:null,
  erros:'',acertos:'',data:today(),notas:'',resumo_ia:'',score:null,imagem:null,
  bt_confluencias:[],bt_tinha_lt_choch:false,bt_retestou:false,bt_tipo_retest:'',bt_mm_proxima:false,bt_mm_respeitou:'',bt_candles_ate_alvo:'',bt_lt_forca:'',bt_ate_onde_foi:'',bt_saiu_antes:false,bt_motivo_saiu:'',bt_contexto:''};
}

// ── LOAD ───────────────────────────────────────────────────────────
Object.keys(JOURNALS).forEach(k=>{journals[k]=initJournal(k);});
try{
  const raw=localStorage.getItem('zjournals');
  if(raw){
    const d=JSON.parse(raw);
    Object.keys(JOURNALS).forEach(k=>{if(d[k])journals[k]={...initJournal(k),...d[k]};});
  }
}catch{}
try{const a=localStorage.getItem('zactive');if(a&&JOURNALS[a])activeJournal=a;}catch{}
// migração: regiao/gatilho (texto) -> regioes/gatilhos (lista) + sinal do P&L
Object.keys(journals).forEach(k=>{
  (journals[k].trades||[]).forEach(t=>{
    if(t.resultado==='Loss'&&t.pnl>0)t.pnl=-Math.abs(t.pnl);
    if(t.resultado==='Win'&&t.pnl<0)t.pnl=Math.abs(t.pnl);
    if((t.resultado==='BE'||t.resultado==='BE e depois andou')&&t.pnl)t.pnl=0;
    if(t.regiao&&!t.regioes)t.regioes=[t.regiao];
    if(t.gatilho&&!t.gatilhos)t.gatilhos=[t.gatilho];
    if(!t.regioes)t.regioes=[];
    if(!t.gatilhos)t.gatilhos=[];
  });
});
ui.formData=emptyForm();

function save(){
  try{localStorage.setItem('zjournals',JSON.stringify(journals));}catch{}
  try{localStorage.setItem('zactive',activeJournal);}catch{}
}

// ── HELPERS ────────────────────────────────────────────────────────
function today(){return new Date().toLocaleDateString('pt-BR');}
function weekday(s){if(!s)return'';const[d,m,y]=s.split('/');try{return['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(`${y}-${m}-${d}`).getDay()]||'';}catch{return'';}}
function cur(){return CFG().currency;}
function fmt(n){if(n===null||n===undefined||n==='')return'—';const x=Number(n);return`${x>=0?'':'-'}${cur()}${Math.abs(x).toFixed(2)}`;}
function getDailyPnl(){return J().trades.filter(t=>t.data===today()).reduce((s,t)=>s+(t.pnl||0),0);}
function getStopsToday(){return J().trades.filter(t=>t.data===today()&&t.resultado==='Loss').length;}
function getConsec(){let c=0;for(const t of J().trades.filter(t=>t.data===today())){if(t.resultado==='Loss')c++;else break;}return c;}

function riskPerTrade(){
  const j=J();
  if(j.riskMode==='fixed')return j.fixedStop||0;
  return j.capital*((j.riskPct||0.5)/100);
}
function maxDailyLoss(){
  const j=J();
  if(j.riskMode==='fixed')return (j.fixedStop||0)*(j.maxConsec||2);
  return j.capital*((j.maxLossPct||3)/100);
}
function allFiltersOk(t){
  const j=J();
  if(!j.filters.length)return null;
  return j.filters.every(f=>(t.filtros||[]).includes(f));
}

function calcStats(trades){
  if(!trades.length)return null;
  const wins=trades.filter(t=>t.resultado==='Win');
  const losses=trades.filter(t=>t.resultado==='Loss');
  const totalPnl=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const gw=wins.reduce((s,t)=>s+(t.pnl||0),0);
  const gl=Math.abs(losses.reduce((s,t)=>s+(t.pnl||0),0));
  const pf=gl>0?(gw/gl).toFixed(2):wins.length>0?'∞':'—';
  const rrs=trades.filter(t=>t.rr_realizado);
  const avgRR=rrs.length?(rrs.reduce((s,t)=>s+t.rr_realizado,0)/rrs.length).toFixed(2):'—';
  return{totalPnl,wins:wins.length,losses:losses.length,winRate:Math.round((wins.length/trades.length)*100),pf,avgRR};
}
function rcColor(r){return RC_DEFAULT[r]||'#22c55e';}
// ── horários / períodos do pregão
const JANELAS=[
  {nome:'Pré-abertura',ini:0,fim:539,cor:'#64748b'},
  {nome:'Abertura (9h)',ini:540,fim:599,cor:'#f59e0b'},
  {nome:'Abertura das ações (10h)',ini:600,fim:629,cor:'#16a34a'},
  {nome:'Abertura EUA (10h30)',ini:630,fim:689,cor:'#06b6d4'},
  {nome:'Meio do dia',ini:690,fim:899,cor:'#64748b'},
  {nome:'Tarde',ini:900,fim:1019,cor:'#22c55e'},
  {nome:'Fechamento',ini:1020,fim:1439,cor:'#ef4444'},
];
function hm2min(h){if(!h)return null;const p=String(h).split(':').map(Number);if(isNaN(p[0]))return null;return p[0]*60+(p[1]||0);}
function classifyJanela(h){const m=hm2min(h);if(m===null)return'';const j=JANELAS.find(x=>m>=x.ini&&m<=x.fim);return j?j.nome:'';}
function janelaCor(n){const j=JANELAS.find(x=>x.nome===n);return j?j.cor:'#64748b';}
function duracao(a,b){const x=hm2min(a),y=hm2min(b);if(x===null||y===null||y<x)return'';const d=y-x;return d<60?`${d} min`:`${Math.floor(d/60)}h${String(d%60).padStart(2,'0')}`;}
function inicioSemana(d){const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}
function matchPeriodo(t){
  const f=ui.filter, d=parseDate(t.data);
  if(!d)return !(f.dataPreset||f.dataIni||f.dataFim||f.mesRef);
  const hoje=new Date();hoje.setHours(0,0,0,0);
  if(f.dataPreset==='hoje')      return dkey(d)===dkey(hoje);
  if(f.dataPreset==='ontem'){const o=new Date(hoje);o.setDate(o.getDate()-1);return dkey(d)===dkey(o);}
  if(f.dataPreset==='semana')    return d>=inicioSemana(hoje);
  if(f.dataPreset==='semana_ant'){const i=inicioSemana(hoje);const a=new Date(i);a.setDate(a.getDate()-7);return d>=a&&d<i;}
  if(f.dataPreset==='mes')       return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();
  if(f.dataPreset==='mes_ant'){const m=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear();}
  if(f.dataPreset==='ano')       return d.getFullYear()===hoje.getFullYear();
  if(f.dataPreset==='7'||f.dataPreset==='30'||f.dataPreset==='90'){const c=new Date(hoje);c.setDate(c.getDate()-parseInt(f.dataPreset));return d>=c;}
  if(f.dataPreset==='mesref'&&f.mesRef){const [y,m]=f.mesRef.split('-').map(Number);return d.getFullYear()===y&&d.getMonth()===m-1;}
  if(f.dataPreset==='intervalo'){
    if(f.dataIni){const a=new Date(f.dataIni+'T00:00:00');if(d<a)return false;}
    if(f.dataFim){const b=new Date(f.dataFim+'T00:00:00');if(d>b)return false;}
    return true;
  }
  return true;
}
function parseDate(str){const p=String(str||'').split('/').map(Number);if(p.length<3||!p[0]||!p[1]||!p[2])return null;return new Date(p[2],p[1]-1,p[0]);}
function dkey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtK(n){const a=Math.abs(n);const sg=n>0?'+':n<0?'-':'';return a>=1000?`${sg}${cur()}${(a/1000).toFixed(1).replace('.',',')} mil`:`${sg}${cur()}${a.toFixed(0)}`;}
function normPnl(resultado,valor){
  const n=Math.abs(Number(valor)||0);
  if(resultado==='Loss')return -n;
  if(resultado==='Win')return n;
  if(resultado==='BE'||resultado==='BE e depois andou')return 0;
  return Number(valor)||0;
}
function extractJSON(raw){
  let t=String(raw).replace(/```json|```/g,'').trim();
  try{return JSON.parse(t);}catch{}
  const i=t.indexOf('{'),k=t.lastIndexOf('}');
  if(i>=0&&k>i){
    const slice=t.slice(i,k+1);
    try{return JSON.parse(slice);}catch{}
    try{return JSON.parse(slice.replace(/,\s*([}\]])/g,'$1'));}catch{}
  }
  throw new Error('JSON não encontrado');
}
function totContratos(t){return (t.parciais||[]).reduce((a,p)=>a+(Number(p.contratos)||0),0);}
function mediaPtsParcial(t){
  const ps=(t.parciais||[]).filter(p=>Number(p.pontos));
  if(!ps.length)return null;
  const tc=ps.reduce((a,p)=>a+(Number(p.contratos)||1),0);
  const soma=ps.reduce((a,p)=>a+Number(p.pontos)*(Number(p.contratos)||1),0);
  return Math.round(soma/tc);
}
function rrPlan(t){
  const st=parseFloat(t.pontos_stop),gn=parseFloat(t.pontos_gain);
  if(!st||!gn||st<=0)return null;
  return (gn/st).toFixed(2);
}

function getPARSE_PROMPT(){
  const j=J(),c=CFG();
  let extra=isLiq()
    ?`\nRegiões: ${j.regions.join(', ')}.\nGatilhos (M1): ${j.triggers.join(', ')}.\nFiltros obrigatórios: ${j.filters.join(', ')}.\nConfluências possíveis: ${j.confluences.join(', ')}.`
    :`\nSetups: ${j.setups.join(', ')}.`;
  return `Você é especialista em análise de trades (${c.name}). Capital ${c.currency}${j.capital}, risco ${c.currency}${riskPerTrade().toFixed(2)}/operação (${j.riskPct}%), máximo ${j.maxConsec} stops no dia ou ${j.maxLossPct}% de perda.${extra}
Ativos: ${j.pairs.join(', ')}.
Se receber uma IMAGEM de relatório de performance (Nelogica/Profit/corretora), leia a tabela linha a linha.
Colunas típicas da Nelogica e como mapear:
- "Ativo" (ex: WINV25, WINZ25) -> use apenas o código base do ativo (WIN)
- "Abertura" / "Fechamento" -> horários; use a Abertura para deduzir a sessão (até 11h=Manhã, 11h-15h=Tarde, após 15h=Fechamento; antes da 9h30=Abertura)
- "Qtd" (ex: "15 C" = 15 contratos na compra, "15 V" = venda) -> "C" significa direcao "Compra", "V" significa "Venda"
- "Preço Compra" e "Preço Venda" -> preços de entrada e saída
- "Res. Operação" em R$ -> este é o pnl (mantenha o sinal: valores em vermelho/negativos são prejuízo)
- "Res. Operação (pts)" ou "Res. Intervalo (%)" com "pts" -> resultado em pontos
- Se o resultado financeiro for negativo, "resultado" é "Loss"; se positivo, "Win"; se zero, "BE"
Quando houver resultado em pontos negativo, ele representa os pontos perdidos — coloque esse valor absoluto em "pontos_stop" apenas se for claramente o stop; caso contrário deixe null.
IMPORTANTE: responda APENAS com o objeto JSON, sem nenhum texto antes ou depois, sem explicação.
Retorne SOMENTE JSON sem markdown:
{"par":"${j.pairs[0]||''}",${isLiq()?`"regioes":[],"gatilhos":[],"filtros":[],"confluencias":[],"setup":""`:`"setup":"","regiao":"","gatilho":"","filtros":[],"confluencias":[]`},"direcao":"Compra","resultado":"Win","pnl":${riskPerTrade().toFixed(2)},"rr_realizado":1,"pontos_stop":null,"pontos_gain":null,"saiu_parcial":false,"parcial_pct":null,"fibo_nivel":null,"timeframe":"M1","sessao":"","emocao":"Neutro","seguiu_regras":true,"moveu_be_cedo":false,"tinha_confluencia":true,"erros":null,"acertos":null,"data":"${today()}","notas":null,"resumo_ia":"análise com dica de melhoria","score":7}
IMPORTANTE: "regioes", "gatilhos", "filtros" e "confluencias" são ARRAYS (um trade pode ter mais de uma região e mais de um gatilho ao mesmo tempo). Inclua TODOS os itens mencionados, não apenas um. Exemplo: "filtros":["Preço esticado","Frequência baixa","Amplitude alta"], "confluencias":["POC","VWAP diária"]. Use os textos EXATOS das listas acima. Se nenhum foi mencionado, use []. Para "pontos_stop" e "pontos_gain" extraia os pontos mencionados (ex: "stop de 150 pontos e alvo de 450" -> pontos_stop:150, pontos_gain:450).`;
}

function badge(text,color){return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${escHtml(String(text))}</span>`;}
function toggle(checked,onchange,label){return `<label class="toggle-wrap"><div class="toggle-track" style="background:${checked?'#22c55e':'#1e3a5f'}" onclick="${onchange}"><div class="toggle-thumb" style="left:${checked?18:3}px"></div></div>${label?`<span style="color:#94a3b8;font-size:13px">${label}</span>`:''}</label>`;}
function sel(val,opts,onchange,placeholder=''){return `<select onchange="${onchange}"><option value="">${placeholder}</option>${opts.map(o=>`<option value="${escHtml(o)}"${val===o?'selected':''}>${escHtml(o)}</option>`).join('')}</select>`;}
function inp(val,onchange,placeholder='',type='text'){return `<input type="${type}" value="${escHtml(String(val||''))}" oninput="${onchange.replace('setFD(','setFDq(')}" placeholder="${placeholder}">`;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function chips(opts,selected,fn,color='#22c55e'){
  return `<div style="display:flex;flex-wrap:wrap;gap:6px">${opts.map((o,i)=>{
    const a=(selected||[]).includes(o);
    return `<button type="button" class="chip" onclick="${fn}(${i})" style="background:${a?color+'2a':'transparent'};border-color:${a?color:'#1e3a5f'};color:${a?color:'#475569'}">${escHtml(o)}</button>`;
  }).join('')}</div>`;
}

      const ec=EC[t.emocao]||'#64748b';
      const fok=allFiltersOk(t);
      html+=`<div class="trade-card" style="border:1px solid ${t.resultado==='Win'?'#22c55e33':t.resultado==='Loss'?'#ef444433':t.resultado==='BE e depois andou'?'#f9731633':'#1e3a5f'}">
        <div class="trade-row" onclick="toggleTrade(${idx})">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            ${badge(t.resultado,rc)}
            <span style="font-weight:700;color:#f1f5f9;font-size:14px">${escHtml(t.par||'')}</span>
            ${(t.regioes||[]).map(r=>badge(r,'#16a34a')).join('')}
            ${(t.gatilhos||[]).map(g=>badge(g,'#06b6d4')).join('')}
            ${t.setup?badge(t.setup,'#334155'):''}
            ${t.direcao?badge(t.direcao,t.direcao==='Compra'?'#22c55e':'#ef4444'):''}
            ${fok===true?badge('Filtros ✓','#22c55e'):fok===false?badge('Filtros ✗','#ef4444'):''}
            ${(t.confluencias||[]).length?badge(`${t.confluencias.length} confl.`,'#f59e0b'):''}
            ${t.importado&&!t.revisado?badge('a revisar','#f59e0b'):''}
            ${t.janela?badge(t.janela+(t.hora_entrada?' · '+t.hora_entrada:''),janelaCor(t.janela)):''}
            ${t.pontos_stop&&t.pontos_gain?badge(`${t.pontos_stop}→${t.pontos_gain}pts`,'#22c55e'):''}
            ${t.saiu_parcial?badge(`${(t.parciais||[]).length||1}× parcial${mediaPtsParcial(t)!==null?` · ${mediaPtsParcial(t)}pts`:''}`,'#f59e0b'):''}
            <span style="color:#475569;font-size:11px">${escHtml(t.data||'')}${weekday(t.data)?' · '+weekday(t.data):''}</span>
            ${t.sessao?`<span style="color:#475569;font-size:11px">· ${escHtml(t.sessao)}</span>`:''}
            ${t.emocao?`<span style="color:${ec};font-size:11px;font-weight:600">● ${escHtml(t.emocao)}</span>`:''}
            ${t.moveu_be_cedo?badge('BE precoce','#f59e0b'):''}
            ${!t.seguiu_regras?badge('Fora do plano','#ef4444'):''}
            ${t.imagem?'<span style="color:#22c55e;font-size:11px">📷</span>':''}
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:${rc};font-weight:700;font-size:15px">${fmt(t.pnl)}</span>
            ${t.rr_realizado?`<span style="color:#64748b;font-size:11px">R:${t.rr_realizado}</span>`:''}
            <button onclick="event.stopPropagation();editTrade(${idx})" title="Editar trade" style="background:#12161b;border:1px solid #1e242c;border-radius:7px;color:#9aa3ad;cursor:pointer;font-size:11.5px;padding:5px 11px;font-weight:600">✏️ Editar</button>
            <button onclick="event.stopPropagation();deleteTrade(${idx})" title="Remover trade" style="background:none;border:none;color:#374151;cursor:pointer;font-size:18px;padding:0 2px">×</button>
          </div>
        </div>
        ${open?renderTradeDetail(t):''}
      </div>`;
    });
  }
  else if(ui.tab==='calendar'){html+=renderCalendar();}
  else if(ui.tab==='equity'){html+=renderEquity();}
  else if(ui.tab==='stats'){html+=renderStats();}
  else if(ui.tab==='config'){html+=renderConfig();}

  html+=`</main></div>
  ${renderImport()}
  <div style="position:fixed;bottom:20px;right:20px;z-index:200">
    <button onclick="openClaude()" class="btn-primary" style="border-radius:50px;padding:12px 20px;box-shadow:0 4px 20px #22c55e66">💬 Perguntar à Zella</button>
  </div>`;

  app.innerHTML=html;
}

// ── FORM ───────────────────────────────────────────────────────────

      ${isLiq()
        ?`<div class="grid2">
            <div><label class="label">ATIVO *</label>${sel(f.par,j.pairs,"setFD('par',this.value)",'Selecione')}</div>
            <div><label class="label">RESULTADO *</label>${sel(f.resultado,j.results,"setFD('resultado',this.value)",'Selecione')}</div>
          </div>
          <div><label class="label">📍 REGIÃO * ${(f.regioes||[]).length?`(${f.regioes.length})`:'— pode marcar mais de uma'}</label>${chips(j.regions,f.regioes,'toggleRegiao','#16a34a')}</div>
          <div><label class="label">⚡ GATILHO M1 * ${(f.gatilhos||[]).length?`(${f.gatilhos.length})`:'— pode marcar mais de um'}</label>${chips(j.triggers,f.gatilhos,'toggleGatilho','#06b6d4')}</div>`
        :`<div class="grid3">
            <div><label class="label">PAR *</label>${sel(f.par,j.pairs,"setFD('par',this.value)",'Selecione')}</div>
            <div><label class="label">SETUP *</label>${sel(f.setup,j.setups,"setFD('setup',this.value)",'Selecione')}</div>
            <div><label class="label">RESULTADO *</label>${sel(f.resultado,j.results,"setFD('resultado',this.value)",'Selecione')}</div>
          </div>`}

      ${fTotal?`<div class="filter-box" style="border-color:${allOk?'#22c55e55':'#ef444455'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

        </div>
        ${j.filters.map(o=>{
          const on=(f.filtros||[]).includes(o);
          return `<div class="check-row" onclick="toggleFiltro(${j.filters.indexOf(o)})">
            <div class="checkbox" style="border-color:${on?'#22c55e':'#334155'};background:${on?'#22c55e':'transparent'};color:#060d1f">${on?'✓':''}</div>
            <span style="color:${on?'#f1f5f9':'#64748b'};font-size:13px">${escHtml(o)}</span>
          </div>`;
        }).join('')}
        ${!allOk?`<div style="color:#ef4444;font-size:11px;margin-top:8px">⚠ Entrada fora do padrão — nem todos os filtros foram atendidos</div>`:''}
      </div>`:''}

      ${j.confluences.length?`<div>
        <label class="label">🔗 CONFLUÊNCIAS ${(f.confluencias||[]).length?`(${f.confluencias.length})`:''}</label>

      <div class="grid4">

        <div>
          <label class="label">P&L (${cur()}) ${f.resultado==='Loss'?'<span style="color:#ef4444">— será salvo negativo</span>':f.resultado==='Win'?'<span style="color:#22c55e">— será salvo positivo</span>':(f.resultado==='BE'||f.resultado==='BE e depois andou')?'<span style="color:#f59e0b">— BE = zero</span>':''}</label>
          ${(f.resultado==='BE'||f.resultado==='BE e depois andou')
            ?`<input type="number" value="0" disabled style="opacity:0.5">`
            :inp(f.pnl,"setFD('pnl',this.value)",RPT.toFixed(0),'number')}

        <div><label class="label">RR REALIZADO</label>${inp(f.rr_realizado,"setFD('rr_realizado',this.value)",'1.0','number')}</div>
        <div><label class="label">DATA</label>${inp(f.data,"setFD('data',this.value)",'DD/MM/YYYY')}</div>
      </div>

      <div style="background:#060d1f;border-radius:8px;padding:12px;border:1px solid #06b6d433">
        <div style="color:#06b6d4;font-size:10px;font-weight:700;letter-spacing:0.6px;margin-bottom:9px">🕐 HORÁRIO DA OPERAÇÃO</div>
        <div class="grid3">
          <div><label class="label">ENTRADA</label><input type="time" value="${escHtml(f.hora_entrada||'')}" oninput="setHora('hora_entrada',this.value)"></div>
          <div><label class="label">SAÍDA</label><input type="time" value="${escHtml(f.hora_saida||'')}" oninput="setHora('hora_saida',this.value)"></div>
          <div><label class="label">PERÍODO (automático)</label><div id="janela-calc" style="font-weight:700;font-size:13px;padding:9px 0;color:${janelaCor(classifyJanela(f.hora_entrada))}">${classifyJanela(f.hora_entrada)||'—'}${duracao(f.hora_entrada,f.hora_saida)?` <span style="color:#475569;font-weight:400">· ${duracao(f.hora_entrada,f.hora_saida)}</span>`:''}</div></div>
        </div>
      </div>

      <div style="background:#060d1f;border-radius:8px;padding:12px;border:1px solid #22c55e33">
        <div style="color:#22c55e;font-size:10px;font-weight:700;letter-spacing:0.6px;margin-bottom:9px">📏 PONTOS DA OPERAÇÃO</div>
        <div class="grid3">
          <div><label class="label">STOP (pontos)</label><input type="number" value="${escHtml(String(f.pontos_stop||''))}" oninput="setPontos('pontos_stop',this.value)" placeholder="ex: 150"></div>
          <div><label class="label">ALVO / GAIN (pontos)</label><input type="number" value="${escHtml(String(f.pontos_gain||''))}" oninput="setPontos('pontos_gain',this.value)" placeholder="ex: 450"></div>
          <div><label class="label">RR PLANEJADO</label><div id="rr-calc" style="color:${rrPlan(f)?'#22c55e':'#334155'};font-weight:700;font-size:16px;padding:8px 0">${rrPlan(f)?`1 : ${rrPlan(f)}`:'—'}</div></div>
        </div>
      </div>

      <div class="grid3">
        ${c.hasFibo&&f.setup==='Fibo'?`<div><label class="label">NÍVEL FIBO</label>${sel(f.fibo_nivel,FIBO_LVL,"setFD('fibo_nivel',this.value)",'—')}</div>`:''}
        <div><label class="label">TIMEFRAME</label>${sel(f.timeframe,j.timeframes,"setFD('timeframe',this.value)",'—')}</div>
        <div><label class="label">SESSÃO</label>${sel(f.sessao,j.sessions,"setFD('sessao',this.value)",'—')}</div>
        <div><label class="label">EMOÇÃO</label>${sel(f.emocao,EMOTS,"setFD('emocao',this.value)",'—')}</div>
      </div>

      <div style="background:#0b0e11;border-radius:8px;padding:13px;border:1px solid #f59e0b33">
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;${f.saiu_parcial?'margin-bottom:12px':''}">
          ${toggle(f.saiu_parcial,"toggleFD('saiu_parcial')",'Saiu em parciais')}
          ${f.saiu_parcial?`<span style="color:#4b5563;font-size:11.5px">${(f.parciais||[]).length}/4 registradas${totContratos(f)?` · ${totContratos(f)} contratos${f.qtd?` de ${f.qtd}`:''}`:''}${mediaPtsParcial(f)!==null?` · média ${mediaPtsParcial(f)} pts`:''}</span>`:''}
        </div>
        ${f.saiu_parcial?`
          <div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr 30px;gap:8px;margin-bottom:5px">

          ${(f.parciais||[]).map((p,i)=>`<div style="display:grid;grid-template-columns:28px 1fr 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:7px">

            <input type="number" value="${p.pct??''}" oninput="setParcial(${i},'pct',this.value)" placeholder="ex: 30" min="1" max="100">
            <button onclick="delParcial(${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:15px">×</button>
          </div>`).join('')}

      ${c.hasFibo&&f.setup==='Fibo'?renderFiboFields(f):''}

      <div class="grid2">
        <div><label class="label">ACERTOS</label><textarea oninput="setFDq('acertos',this.value)" style="min-height:60px;resize:vertical">${escHtml(f.acertos||'')}</textarea></div>

      <div>
        <label class="label">📷 PRINT DO GRÁFICO</label>
        ${f.imagem
          ?`<div style="position:relative;display:inline-block"><img src="${f.imagem}" class="img-preview" style="max-height:200px"><button onclick="setFD('imagem',null)" style="position:absolute;top:4px;right:4px;background:#ef4444;border:none;border-radius:50%;width:20px;height:20px;color:#fff;cursor:pointer;font-size:12px;line-height:1">×</button></div>`
          :`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:#060d1f;border:1px dashed #1e3a5f;border-radius:8px;padding:12px;color:#475569;font-size:13px"><span>📎 Anexar print do gráfico ou do relatório</span><input type="file" accept="image/*" onchange="loadImage(event)" style="display:none"></label>`}
      </div>

      ${ui.formErr?`<div style="color:#ef4444;font-size:12px">⚠ ${ui.formErr}</div>`:''}
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn-ghost" onclick="hideForm()">Cancelar</button>
        <button class="btn-primary" onclick="saveTrade()">💾 ${ui._revisao&&pendentes().length>1?'Salvar e ir para o próximo':'Salvar Trade'}</button>
      </div>
    </div>`;
  }
  html+=`</div>`;
  return html;
}

    <div style="display:grid;gap:12px">

        ${toggle(f.bt_tinha_lt_choch,"toggleFD('bt_tinha_lt_choch')",'Tinha LT/CHoCH forte?')}

function renderTradeDetail(t){
  const c=CFG(),j=J();
  const fok=allFiltersOk(t);
  const missing=j.filters.filter(x=>!(t.filtros||[]).includes(x));
  return `<div class="trade-detail">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px">
      ${[['TF',t.timeframe||'—'],['Entrada',t.hora_entrada||'—'],['Saída',t.hora_saida||'—'],['Duração',duracao(t.hora_entrada,t.hora_saida)||'—'],['Qtd',t.qtd??'—'],['Preço ent.',t.preco_entrada??'—'],['Preço saí.',t.preco_saida??'—'],['Pts result.',t.pontos_resultado??'—'],['Stop',t.pontos_stop?`${t.pontos_stop} pts`:'—'],['Alvo',t.pontos_gain?`${t.pontos_gain} pts`:'—'],['RR plan.',rrPlan(t)?`1:${rrPlan(t)}`:'—'],['RR real',t.rr_realizado?`1:${t.rr_realizado}`:'—'],['Parciais',t.saiu_parcial?`${(t.parciais||[]).length||1}×`:'Não'],['Regras',t.seguiu_regras?'Sim ✓':'Não ✗']].map(([l,v])=>`<div style="background:#060d1f;border-radius:8px;padding:8px 10px"><div style="color:#475569;font-size:10px;margin-bottom:2px">${l}</div><div style="color:#f1f5f9;font-size:12px;font-weight:600">${escHtml(String(v))}</div></div>`).join('')}
    </div>

    ${j.filters.length?`<div style="background:#060d1f;border-radius:8px;padding:10px 12px;border:1px solid ${fok?'#22c55e33':'#ef444433'}">
      <div style="color:${fok?'#22c55e':'#ef4444'};font-size:10px;font-weight:700;margin-bottom:6px">${fok?'✓ TODOS OS FILTROS ATENDIDOS':'✗ FILTROS INCOMPLETOS'}</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${(t.filtros||[]).map(x=>`<span style="background:#22c55e22;color:#22c55e;font-size:11px;padding:2px 8px;border-radius:10px">✓ ${escHtml(x)}</span>`).join('')}
        ${missing.map(x=>`<span style="background:#ef444422;color:#ef4444;font-size:11px;padding:2px 8px;border-radius:10px">✗ ${escHtml(x)}</span>`).join('')}
      </div>
    </div>`:''}

    ${(t.confluencias||[]).length?`<div style="background:#060d1f;border-radius:8px;padding:10px 12px;border:1px solid #f59e0b33">
      <div style="color:#f59e0b;font-size:10px;font-weight:700;margin-bottom:6px">🔗 CONFLUÊNCIAS (${t.confluencias.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${t.confluencias.map(x=>`<span style="background:#f59e0b22;color:#fbbf24;font-size:11px;padding:2px 8px;border-radius:10px">${escHtml(x)}</span>`).join('')}</div>
    </div>`:''}

    ${c.hasFibo&&t.setup==='Fibo'&&(t.bt_ate_onde_foi||t.bt_confluencias?.length)?`<div style="background:#060d1f;border-radius:8px;padding:10px 12px;border:1px solid #22c55e33">
      <div style="color:#22c55e;font-size:10px;font-weight:700;margin-bottom:6px">🎯 DADOS FIBO</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:#94a3b8">
        ${t.bt_confluencias?.length?`<span>Confluências: ${t.bt_confluencias.join(', ')}</span>`:''}
        ${t.bt_ate_onde_foi?`<span>Foi até: ${t.bt_ate_onde_foi}</span>`:''}
        ${t.bt_lt_forca?`<span>LT: ${t.bt_lt_forca}</span>`:''}
        ${t.bt_contexto?`<span>Contexto: ${t.bt_contexto}</span>`:''}
      </div>
    </div>`:''}

    ${(t.acertos||t.erros)?`<div class="grid2">
      ${t.acertos?`<div style="background:#052e16;border-radius:8px;padding:10px 12px;border:1px solid #22c55e33"><div style="color:#22c55e;font-size:10px;font-weight:700;margin-bottom:4px">✓ ACERTOS</div><div style="color:#bbf7d0;font-size:12px">${escHtml(t.acertos)}</div></div>`:''}
      ${t.erros?`<div style="background:#1c0606;border-radius:8px;padding:10px 12px;border:1px solid #ef444433"><div style="color:#ef4444;font-size:10px;font-weight:700;margin-bottom:4px">✗ ERROS</div><div style="color:#fca5a5;font-size:12px">${escHtml(t.erros)}</div></div>`:''}
    </div>`:''}
    ${t.resumo_ia?`<div style="background:#060d1f;border-radius:8px;padding:10px 12px;border:1px solid #22c55e33"><div style="color:#22c55e;font-size:10px;font-weight:700;margin-bottom:4px">⚡ ANÁLISE IA</div><div style="color:#cbd5e1;font-size:12px;line-height:1.6">${escHtml(t.resumo_ia)}</div></div>`:''}
    ${t.notas?`<div style="color:#64748b;font-size:12px;font-style:italic">📝 ${escHtml(t.notas)}</div>`:''}
    ${t.imagem?`<div><div style="color:#475569;font-size:10px;margin-bottom:4px">📷 PRINT DO GRÁFICO</div><img src="${t.imagem}" class="img-preview"></div>`:''}
  </div>`;
}

        ${items.length?items.map((o,i)=>`<span class="tag-item">
          ${escHtml(o)}
          ${pausable?`<span style="color:${j.paused.includes(o)?'#f59e0b':'#334155'};cursor:pointer;font-size:10px" onclick="togglePause('${escHtml(o).replace(/'/g,"\\'")}')">${j.paused.includes(o)?'⏸':'●'}</span>`:''}
          <button class="btn-danger" onclick="removeItem('${key}',${i})">×</button>

    <div class="card" style="background:#1e3a5f22;border-color:#22c55e55;margin-bottom:4px">
      <div style="color:#94a3b8;font-size:12px;line-height:1.6">
        ⚙️ Configurações do diário <b style="color:#22c55e">${c.icon} ${c.name}</b>. Cada diário tem listas e trades independentes.

    ${isLiq()?listSection('FILTROS OBRIGATÓRIOS','✓',j.filters,'filters',false,'#22c55e'):''}
    ${isLiq()?listSection('CONFLUÊNCIAS','🔗',j.confluences,'confluences',false,'#f59e0b'):''}
    ${!isLiq()?listSection('SETUPS','📐',j.setups,'setups',false):''}
    ${listSection('RESULTADOS','🏆',j.results,'results',false)}
    ${listSection('TIMEFRAMES','⏱',j.timeframes,'timeframes',false)}
    ${listSection('SESSÕES','🕐',j.sessions,'sessions',false)}

    <div class="card">
      <div class="section-label" style="color:#f59e0b">⚠ GESTÃO DE RISCO</div>
      <div class="grid2">
        <div>
          <label class="label">MODO DE RISCO</label>
          <select onchange="setRiskMode(this.value)">
            <option value="pct"${j.riskMode==='pct'?' selected':''}>% do capital</option>

        ${j.riskMode==='fixed'
          ?`<div><label class="label">STOP FIXO (${c.currency})</label><input type="number" value="${j.fixedStop||0}" onchange="setCfgVal('fixedStop',this.value)"></div>`
          :`<div><label class="label">RISCO POR OPERAÇÃO (%)</label><input type="number" value="${j.riskPct||5}" onchange="setCfgVal('riskPct',this.value)" step="0.5"><div style="color:#475569;font-size:11px;margin-top:4px">= ${fmt(riskPerTrade())}</div></div>`}
      </div>
      <div class="grid2" style="margin-top:10px">
        <div>
          <label class="label">MÁX STOPS NO DIA</label>
          <input type="number" value="${j.maxConsec||2}" onchange="setCfgVal('maxConsec',this.value)" min="1" max="10">
        </div>
        <div>
          <label class="label">% PERDA DIÁRIA MÁXIMA</label>
          <input type="number" value="${j.maxLossPct||10}" onchange="setCfgVal('maxLossPct',this.value)" step="0.5">

        return `<div style="color:#9aa3ad;font-size:12px;line-height:1.7;margin-bottom:11px">
          Seus trades ficam guardados apenas neste navegador. Limpar os dados de navegação apaga tudo.
          O backup baixa um arquivo com os dois diários — guarde num drive ou no e-mail.

            ${u?`Último: ${u.toLocaleDateString('pt-BR')} (${dias} dia${dias!==1?'s':''} atrás)`:'Nenhum backup feito ainda'}

        <button onclick="if(confirm('Restaurar listas padrão de ${c.name}?'))resetLists()" class="btn-ghost" style="color:#f59e0b;border-color:#f59e0b44;font-size:12px">Restaurar listas padrão</button>

}

// ── STATS ──────────────────────────────────────────────────────────
function renderStats(){
  const j=J(),c=CFG();
  if(!j.trades.length)return`<div style="text-align:center;padding:48px;color:#374151"><div style="font-size:36px;margin-bottom:10px">📊</div>Registre trades para ver a análise</div>`;
  const T=j.trades, s=calcStats(T);
  const MIN_AMOSTRA=20;
  const media=(s.totalPnl/T.length);

  // ── helpers
  function agg(ts){
    const w=ts.filter(t=>t.resultado==='Win').length;
    const l=ts.filter(t=>t.resultado==='Loss').length;
    const p=ts.reduce((a,t)=>a+(t.pnl||0),0);
    return{w,l,n:ts.length,p,med:ts.length?p/ts.length:0,wr:ts.length?Math.round(w/ts.length*100):0};
  }
  function gs(arr,key,ordem){
    const g={};arr.forEach(t=>{const k=t[key]||'';if(!k)return;(g[k]=g[k]||[]).push(t);});
    let r=Object.entries(g).map(([label,ts])=>({label,...agg(ts)}));
    if(ordem)r.sort((a,b)=>ordem.indexOf(a.label)-ordem.indexOf(b.label));
    else r.sort((a,b)=>b.p-a.p);
    return r;
  }
  function gsArr(arr,key){
    const g={};arr.forEach(t=>{const v=t[key];(Array.isArray(v)?v:v?[v]:[]).forEach(x=>(g[x]=g[x]||[]).push(t));});
    return Object.entries(g).map(([label,ts])=>({label,...agg(ts)})).sort((a,b)=>b.p-a.p);
  }
  function bloco(titulo,sub){
    return `<div style="margin:26px 0 12px">
      <div style="font-size:15px;font-weight:700;color:#e8eaed">${titulo}</div>
      <div style="color:#4b5563;font-size:12px;margin-top:2px">${sub}</div>
    </div>`;
  }
  function tt(titulo,rows,cor='#22c55e',nota){
    if(!rows.length)return'';
    const max=Math.max(...rows.map(r=>Math.abs(r.p)),1);
    return`<div class="card"><div class="section-label" style="color:${cor}">${titulo}</div>
      <div style="display:grid;grid-template-columns:1fr 62px 52px 86px 64px;gap:8px;margin-bottom:5px">
        ${['','Oper.','Acerto','Resultado','Média/op'].map(h=>`<span style="color:#4b5563;font-size:9.5px;font-weight:700">${h}</span>`).join('')}
      </div>
      ${rows.map(r=>`<div style="display:grid;grid-template-columns:1fr 62px 52px 86px 64px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #161b21">
        <div style="min-width:0">
          <div style="color:#e8eaed;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(r.label)}</div>
          <div style="height:3px;border-radius:2px;margin-top:5px;background:#161b21;overflow:hidden"><div style="height:3px;width:${Math.abs(r.p)/max*100}%;background:${r.p>=0?'#22c55e':'#ef4444'};opacity:.55"></div></div>
        </div>
        <div style="font-size:11.5px;color:#9aa3ad">${r.n}${r.n<MIN_AMOSTRA?' <span style="color:#f59e0b" title="amostra baixa">•</span>':''}</div>
        <div style="font-size:11.5px;color:${r.wr>=50?'#22c55e':'#f59e0b'}">${r.wr}%</div>
        <div style="font-size:12.5px;font-weight:700;color:${r.p>=0?'#22c55e':'#ef4444'}">${fmt(r.p)}</div>
        <div style="font-size:11.5px;color:${r.med>=0?'#86efac':'#fca5a5'}">${fmt(r.med)}</div>
      </div>`).join('')}
      ${rows.some(r=>r.n<MIN_AMOSTRA)?`<div style="color:#f59e0b;font-size:10.5px;margin-top:9px">• amostra abaixo de ${MIN_AMOSTRA} operações — o saldo é real, mas ainda não sustenta conclusão</div>`:''}
      ${nota?`<div style="color:#4b5563;font-size:11px;margin-top:8px">${nota}</div>`:''}
    </div>`;
  }

  // ══════ TOPO
  let html=`<div class="grid3" style="margin-bottom:6px">
    ${[
      ['RESULTADO',fmt(s.totalPnl),s.totalPnl>=0?'#22c55e':'#ef4444',`${T.length} operações`],
      ['MÉDIA / OPERAÇÃO',fmt(media),media>=0?'#22c55e':'#ef4444','o número que escala'],
      ['ACERTO',`${s.winRate}%`,s.winRate>=50?'#22c55e':'#f59e0b',`${s.wins}W · ${s.losses}L`],
      ['FATOR DE LUCRO',s.pf,parseFloat(s.pf)>=1.5?'#22c55e':'#f59e0b','ganho ÷ perda'],
      ['RR MÉDIO',`1:${s.avgRR}`,'#e8eaed','realizado'],
      ['DIAS OPERADOS',new Set(T.map(t=>t.data)).size,'#e8eaed',''],
    ].map(([l,v,col,sub])=>`<div class="metric"><div style="color:#4b5563;font-size:9.5px;font-weight:700;letter-spacing:.5px">${l}</div><div style="color:${col};font-weight:700;font-size:20px;margin:3px 0 1px">${v}</div><div style="color:#4b5563;font-size:11px">${sub}</div></div>`).join('')}
  </div>`;

  if(T.length<MIN_AMOSTRA){
    html+=`<div class="card" style="border-color:#f59e0b44;background:#f59e0b0d">
      <div style="color:#f59e0b;font-size:12.5px;line-height:1.7">
        <b>Amostra ainda pequena (${T.length} operações).</b> Os recortes abaixo já mostram o saldo real, mas qualquer conclusão sobre "o que funciona" precisa de mais registros. Os pontinhos laranja marcam os recortes com menos de ${MIN_AMOSTRA} operações.
      </div>
    </div>`;
  }

  // ══════ 1. DISCIPLINA
  html+=bloco('🛡 Disciplina','O que acontece quando você segue — e quando fura — o próprio plano.');

  if(j.filters.length){
    const com=T.filter(t=>allFiltersOk(t)===true), sem=T.filter(t=>allFiltersOk(t)===false);
    const a=agg(com), b=agg(sem);
    const dif=a.wr-b.wr, difMed=a.med-b.med;
    html+=`<div class="card">
      <div class="section-label" style="color:#22c55e">✓ IMPACTO DOS FILTROS OBRIGATÓRIOS</div>
      <div class="grid2">
        <div style="background:#0b1a10;border-radius:9px;padding:14px;border:1px solid #22c55e33">
          <div style="color:#22c55e;font-size:10.5px;font-weight:700;margin-bottom:7px">CHECKLIST COMPLETO (${a.n})</div>
          <div style="color:${a.p>=0?'#22c55e':'#ef4444'};font-weight:700;font-size:21px">${fmt(a.p)}</div>
          <div style="color:#9aa3ad;font-size:11.5px;margin-top:3px">acerto ${a.wr}% · média ${fmt(a.med)}</div>
        </div>
        <div style="background:#1a0b0b;border-radius:9px;padding:14px;border:1px solid #ef444433">
          <div style="color:#ef4444;font-size:10.5px;font-weight:700;margin-bottom:7px">FUROU O CHECKLIST (${b.n})</div>
          <div style="color:${b.p>=0?'#22c55e':'#ef4444'};font-weight:700;font-size:21px">${fmt(b.p)}</div>
          <div style="color:#9aa3ad;font-size:11.5px;margin-top:3px">acerto ${b.wr}% · média ${fmt(b.med)}</div>
        </div>
      </div>
      ${(a.n&&b.n)?`<div style="margin-top:11px;padding:10px 12px;border-radius:8px;background:#0b0e11;font-size:12px;color:${dif>0?'#22c55e':'#f59e0b'}">
        ${dif>0
          ? `Seguindo o checklist seu acerto sobe <b>${dif} pontos percentuais</b> e a média por operação melhora <b>${fmt(difMed)}</b>.`
          : `Ainda sem vantagem clara no acerto${a.n<MIN_AMOSTRA||b.n<MIN_AMOSTRA?' — amostra pequena dos dois lados':''}.`}
      </div>`:''}
    </div>`;
  }

  const be=T.filter(t=>t.moveu_be_cedo&&t.resultado==='Loss').length;
  const beAndou=T.filter(t=>t.resultado==='BE e depois andou').length;
  const nr=T.filter(t=>!t.seguiu_regras).length;
  const nf=T.filter(t=>allFiltersOk(t)===false&&t.resultado==='Loss').length;
  const custoFuro=T.filter(t=>allFiltersOk(t)===false).reduce((a,t)=>a+(t.pnl||0),0);
  html+=`<div class="card"><div class="section-label" style="color:#f59e0b">⚠ ONDE O PLANO VAZA</div>
    ${[
      ['BE e depois andou',beAndou,'Saiu no zero a zero e o preço foi pro alvo'],
      ['Entrou sem o checklist',T.filter(t=>allFiltersOk(t)===false).length,`Saldo dessas operações: ${fmt(custoFuro)}`],
      ['Furou e perdeu',nf,'Entrada fora do padrão que virou prejuízo'],
      ['Moveu BE cedo e perdeu',be,'Antecipou o breakeven e foi stopado'],
      ['Fora das regras',nr,'Marcado por você como fora do plano'],
    ].map(([l,v,d])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #161b21">
      <div><div style="color:#e8eaed;font-size:13px">${l}</div><div style="color:#4b5563;font-size:11px">${d}</div></div>
      <div style="color:${v>0?'#ef4444':'#22c55e'};font-weight:700;font-size:18px">${v}</div>
    </div>`).join('')}
  </div>`;

  // ══════ 2. ONDE VOCÊ GANHA
  html+=bloco('🎯 Onde você ganha','Quais leituras e confirmações pagam a conta.');

  if(isLiq()){
    html+=tt('📍 POR REGIÃO',gsArr(T,'regioes'),'#8b5cf6');
    html+=tt('⚡ POR GATILHO',gsArr(T,'gatilhos'),'#06b6d4');
    const combo={};
    T.forEach(t=>(t.regioes||[]).forEach(r=>(t.gatilhos||[]).forEach(g=>{
      const k=`${r} + ${g}`;(combo[k]=combo[k]||[]).push(t);
    })));
    const cr=Object.entries(combo).map(([label,ts])=>({label,...agg(ts)})).sort((a,b)=>b.p-a.p);
    html+=tt('🔗 REGIÃO + GATILHO',cr,'#22c55e','Cada operação entra em todas as combinações que ela teve.');
    html+=tt('🧩 POR CONFLUÊNCIA',gsArr(T,'confluencias'),'#f59e0b');

    const porQtd={};
    T.forEach(t=>{
      const n=(t.confluencias||[]).length;
      const k=n===0?'Sem confluência':n===1?'1 confluência':`${n} confluências`;
      (porQtd[k]=porQtd[k]||[]).push(t);
    });
    const qr=Object.entries(porQtd).map(([label,ts])=>({label,...agg(ts)}))
      .sort((a,b)=>(parseInt(a.label)||0)-(parseInt(b.label)||0));
    if(qr.length>1)html+=tt('📊 QUANTIDADE DE CONFLUÊNCIAS',qr,'#f59e0b','Mais confirmação melhora o resultado ou só atrasa a entrada?');
  } else {
    html+=tt('📐 POR SETUP',gs(T,'setup'));
    const fibo=T.filter(t=>t.setup==='Fibo');
    if(fibo.length)html+=tt('🎯 FIBO POR NÍVEL',gs(fibo,'fibo_nivel').map(r=>({...r,label:'Fibo '+r.label})));
  }
  if(j.pairs.length>1)html+=tt('💱 POR ATIVO',gs(T,'par'));

  // ── pontos e RR
  const comPts=T.filter(t=>t.pontos_stop&&t.pontos_gain);
  if(comPts.length){
    const avgStop=(comPts.reduce((a,t)=>a+Number(t.pontos_stop),0)/comPts.length).toFixed(0);
    const avgGain=(comPts.reduce((a,t)=>a+Number(t.pontos_gain),0)/comPts.length).toFixed(0);
    const avgRRp=(comPts.reduce((a,t)=>a+parseFloat(rrPlan(t)),0)/comPts.length).toFixed(2);
    html+=`<div class="card"><div class="section-label" style="color:#22c55e">📏 PONTOS PLANEJADOS (${comPts.length} operações)</div>
      <div class="grid3">
        ${[['STOP MÉDIO',`${avgStop} pts`,'#ef4444'],['ALVO MÉDIO',`${avgGain} pts`,'#22c55e'],['RR PLANEJADO',`1 : ${avgRRp}`,'#e8eaed']]
          .map(([l,v,col])=>`<div style="background:#0b0e11;border-radius:8px;padding:11px 13px"><div style="color:#4b5563;font-size:9.5px;font-weight:700">${l}</div><div style="color:${col};font-weight:700;font-size:17px;margin-top:2px">${v}</div></div>`).join('')}
      </div></div>`;
    const faixas={};
    comPts.forEach(t=>{
      const r=parseFloat(rrPlan(t));
      const k=r<1?'RR abaixo de 1':r<2?'RR 1 a 2':r<3?'RR 2 a 3':r<4?'RR 3 a 4':'RR 4 ou mais';
      (faixas[k]=faixas[k]||[]).push(t);
    });
    const fr=Object.entries(faixas).map(([label,ts])=>({label,...agg(ts)}));
    if(fr.length>1)html+=tt('📊 POR FAIXA DE RR PLANEJADO',fr,'#22c55e');
  }

  // ── parciais
  const cp=T.filter(t=>t.saiu_parcial), sp=T.filter(t=>!t.saiu_parcial);
  if(cp.length&&sp.length){
    const a=agg(cp),b=agg(sp);
    html+=`<div class="card"><div class="section-label" style="color:#f59e0b">✂️ PARCIAIS</div>
      <div class="grid2">
        <div style="background:#0b0e11;border-radius:8px;padding:13px">
          <div style="color:#f59e0b;font-size:10.5px;font-weight:700;margin-bottom:6px">COM PARCIAL (${a.n})</div>
          <div style="color:${a.p>=0?'#22c55e':'#ef4444'};font-weight:700;font-size:17px">${fmt(a.p)}</div>
          <div style="color:#4b5563;font-size:11px;margin-top:2px">acerto ${a.wr}% · média ${fmt(a.med)}</div>
        </div>
        <div style="background:#0b0e11;border-radius:8px;padding:13px">

        </div>
      </div></div>`;
  }

  if(cp.length){
    const g={};
    T.forEach(t=>{
      const n=t.saiu_parcial?((t.parciais||[]).length||1):0;

      (g[k]=g[k]||[]).push(t);
    });
    const pr=Object.entries(g).map(([label,ts])=>({label,...agg(ts)})).sort((a,b)=>(parseInt(a.label)||0)-(parseInt(b.label)||0));
    if(pr.length>1)html+=tt('✂️ POR QUANTIDADE DE PARCIAIS',pr,'#f59e0b','Fracionar mais a saída tem melhorado o resultado?');
    const cps=T.filter(t=>mediaPtsParcial(t)!==null);
    if(cps.length){
      const m=Math.round(cps.reduce((a,t)=>a+mediaPtsParcial(t),0)/cps.length);

    }
  }

  // ══════ 3. QUANDO VOCÊ GANHA
  html+=bloco('🕐 Quando você ganha','Horário, dia e duração — e em que estado você estava.');

  html+=tt('🕐 POR PERÍODO DO PREGÃO',gs(T,'janela',JANELAS.map(x=>x.nome)),'#06b6d4');

  // duração
  const comDur=T.filter(t=>hm2min(t.hora_entrada)!==null&&hm2min(t.hora_saida)!==null&&hm2min(t.hora_saida)>=hm2min(t.hora_entrada));
  if(comDur.length){
    const FX=[['menos de 1 min',0,1],['1 a 5 min',1,5],['5 a 15 min',5,15],['15 a 30 min',15,30],['30 a 60 min',30,60],['1 a 2 h',60,120],['mais de 2 h',120,1e9]];
    const g={};
    comDur.forEach(t=>{
      const d=hm2min(t.hora_saida)-hm2min(t.hora_entrada);

  const ordem=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const dr2=ordem.filter(k=>dg[k]).map(label=>({label,...agg(dg[label])}));

  html+=tt('🧠 POR EMOÇÃO',gs(T,'emocao'),'#8b5cf6','Em que estado mental você entra melhor.');

  return html;
}

function serieEquity(trades,porDia){
  const ord=[...trades].filter(t=>parseDate(t.data)).sort((a,b)=>{
    const d=parseDate(a.data)-parseDate(b.data);
    if(d)return d;
    return String(a.hora_entrada||'').localeCompare(String(b.hora_entrada||''));
  });
  let acc=0,pico=0;
  const pts=[];
  if(porDia){
    const dias={};
    ord.forEach(t=>{const k=dkey(parseDate(t.data));(dias[k]=dias[k]||[]).push(t);});
    Object.keys(dias).sort().forEach(k=>{
      const lista=dias[k];
      const pnlDia=lista.reduce((a,t)=>a+(t.pnl||0),0);
      acc+=pnlDia;pico=Math.max(pico,acc);
      const d=parseDate(lista[0].data);
      pts.push({ts:d.getTime(),data:lista[0].data,hora:'',rot:k.split('-').reverse().slice(0,2).join('/'),acc,dd:acc-pico,n:lista.length,delta:pnlDia,
        w:lista.filter(t=>t.resultado==='Win').length,l:lista.filter(t=>t.resultado==='Loss').length});
    });
  } else {
    ord.forEach((t,i)=>{
      acc+=(t.pnl||0);pico=Math.max(pico,acc);
      const d=parseDate(t.data);
      const mm=hm2min(t.hora_entrada);
      pts.push({ts:d.getTime()+(mm!==null?mm*60000:0),data:t.data,hora:t.hora_entrada||'',rot:`#${i+1}`,
        acc,dd:acc-pico,n:1,delta:(t.pnl||0),par:t.par,resultado:t.resultado,idx:i+1});
    });
  }
  return pts;
}

function eqHover(ev){
  const E=window._eq;if(!E)return;
  const svg=document.getElementById('eq-svg');if(!svg)return;
  const r=svg.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const vx=cx*(E.W/r.width);
  let melhor=E.pts[0],dist=Infinity;
  E.pts.forEach(p=>{const d=Math.abs(p.px-vx);if(d<dist){dist=d;melhor=p;}});
  const g=document.getElementById('eq-cross');
  const ln=document.getElementById('eq-vline');
  const dot=document.getElementById('eq-dot');
  const tip=document.getElementById('eq-tip');
  if(!g||!tip)return;
  g.style.display='';
  ln.setAttribute('x1',melhor.px);ln.setAttribute('x2',melhor.px);
  dot.setAttribute('cx',melhor.px);dot.setAttribute('cy',melhor.py);
  dot.setAttribute('stroke',melhor.acc>=0?'#22c55e':'#ef4444');
  const cor=melhor.acc>=0?'#22c55e':'#ef4444';
  const dcor=melhor.delta>=0?'#22c55e':'#ef4444';
  tip.innerHTML=`
    <div style="color:#9aa3ad;font-size:11px;margin-bottom:4px">${melhor.data}${melhor.hora?' · '+melhor.hora:''}${E.porDia?` · ${melhor.n} oper.`:melhor.par?' · '+melhor.par:''}</div>
    <div style="color:${cor};font-weight:700;font-size:15px">${fmt(melhor.acc)}</div>
    <div style="color:${dcor};font-size:11.5px;margin-top:2px">${melhor.delta>=0?'+':''}${fmt(melhor.delta)} ${E.porDia?`no dia${melhor.w!==undefined?` · ${melhor.w}W ${melhor.l}L`:''}`:'nesta operação'}</div>
    ${melhor.dd<0?`<div style="color:#f59e0b;font-size:11px;margin-top:3px">${fmt(melhor.dd)} abaixo do topo</div>`:''}`;
  const px=melhor.px*(r.width/E.W);
  const py=melhor.py*(r.height/E.H);
  tip.style.display='block';
  const tw=tip.offsetWidth||160;
  let left=px+14;
  if(left+tw>r.width)left=px-tw-14;
  tip.style.left=Math.max(4,left)+'px';
  tip.style.top=Math.max(4,py-46)+'px';
}

function norm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
const CAMPOS=[
  {k:'data',   nome:'Data',          chaves:['data','abertura','date','dia']},
  {k:'hora_entrada',nome:'Hora entrada',chaves:['abertura','entrada','hora inicial','inicio','open']},
  {k:'hora_saida',  nome:'Hora saida', chaves:['fechamento','saida','hora final','close']},
  {k:'par',    nome:'Ativo',          chaves:['ativo','papel','instrumento','symbol','contrato']},
  {k:'qtd',    nome:'Quantidade',     chaves:['qtd compra','qtd','quantidade','lotes','contratos','volume']},
  {k:'direcao',nome:'Direcao (C/V)',  chaves:['lado','side','direcao','tipo','c/v','operacao tipo']},
  {k:'pnl',    nome:'Resultado R$',   chaves:['res. operacao','res operacao','resultado operacao','res. intervalo bruto','resultado','lucro','financeiro','liquido','p&l','pnl'],evita:['%','pts','ponto']},
  {k:'pontos', nome:'Resultado pts',  chaves:['res. operacao (%)','res. intervalo (%)','pts','pontos','intervalo (%)'],prefere:['%','pts','ponto']},
  {k:'preco_entrada',nome:'Preco entrada',chaves:['preco compra','preco de entrada','preco entrada']},
  {k:'preco_saida',  nome:'Preco saida',  chaves:['preco venda','preco de saida','preco saida']},
];

function splitCSVLine(line,delim){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===delim&&!q){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur);
  return out.map(x=>x.trim().replace(/^"|"$/g,''));
}
function detectDelim(txt){
  const ls=txt.split(/\r?\n/).filter(x=>x.trim()).slice(0,12);
  const c={';':0,',':0,'\t':0};
  Object.keys(c).forEach(d=>{c[d]=Math.max(...ls.map(l=>l.split(d).length));});
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const delim=detectDelim(txt);
  const linhas=txt.split(/\r?\n/).filter(x=>x.trim());
  if(!linhas.length)return null;
  // acha a linha de cabeçalho (a que tem mais colunas preenchidas)
  let hi=0,best=0;
  for(let i=0;i<Math.min(12,linhas.length);i++){
    const cols=splitCSVLine(linhas[i],delim);
    const n=cols.filter(Boolean).length;
    if(n<3)continue;                                   // linha de metadado
    const texto=cols.filter(c=>c&&numBR(c)===null).length;
    if(texto<n*0.6)continue;                            // linha de dados, não cabeçalho
    if(n>best){best=n;hi=i;}
  }
  const head=splitCSVLine(linhas[hi],delim);
  const rows=linhas.slice(hi+1).map(l=>splitCSVLine(l,delim)).filter(r=>r.filter(Boolean).length>1);
  return{head,rows,delim};
}
function autoMap(head){
  const m={},usados=new Set();
  const hn=head.map(h=>norm(h));
  CAMPOS.forEach(f=>{
    let melhor=-1,score=0;
    hn.forEach((h,i)=>{
      if(!h)return;
      let sc=0;
      f.chaves.forEach((c,ordem)=>{
        const cn=norm(c);
        let base=0;
        if(h===cn)base=100;
        else if(h.startsWith(cn))base=75;
        else if(h.includes(cn))base=55;
        if(base){
          base-=ordem*3;                               // respeita a ordem da lista
          if(f.evita&&f.evita.some(e=>h.includes(e)))base-=60;
          if(f.prefere&&f.prefere.some(e=>h.includes(e)))base+=20;
          if(sc<base)sc=base;
        }
      });
      const livre=!usados.has(i)||['direcao','data','hora_entrada'].includes(f.k);
      if(sc>score&&livre){score=sc;melhor=i;}
    });
    if(melhor>=0&&score>0){
      m[f.k]=melhor;
      if(!['direcao','data','hora_entrada'].includes(f.k))usados.add(melhor);
    }
  });
  return m;
}
function numBR(v){
  if(v===undefined||v===null)return null;
  let t=String(v).replace(/R\$|\s|pts|%/gi,'').trim();
  if(!t)return null;
  const neg=/^\(.*\)$/.test(t)||t.includes('-');
  t=t.replace(/[()\-]/g,'');
  if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(','))t=t.replace(',','.');
  const n=parseFloat(t);
  if(isNaN(n))return null;
  return neg?-Math.abs(n):n;
}
function extraiData(v){
  if(!v)return '';
  const m=String(v).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){let y=m[3];if(y.length===2)y='20'+y;return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${y}`;}
  const iso=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return '';
}
function extraiHora(v){
  if(!v)return '';
  const m=String(v).match(/(\d{1,2}):(\d{2})/);
  return m?`${m[1].padStart(2,'0')}:${m[2]}`:'';
}
function extraiDirecao(v){
  const t=String(v||'').toUpperCase();
  if(/\bC\b|COMPRA|BUY|LONG/.test(t))return 'Compra';
  if(/\bV\b|VENDA|SELL|SHORT/.test(t))return 'Venda';
  return '';
}
function linhaParaTrade(r,map,cfg){
  cfg=cfg||{};
  const g=k=>map[k]!==undefined?r[map[k]]:'';
  let pnl=numBR(g('pnl'));
  const pts=numBR(g('pontos'));
  const qtdN=numBR(g('qtd'));
  let derivado=false;
  if(pnl===null&&pts!==null&&cfg.valorPonto){
    pnl=pts*(qtdN||1)*cfg.valorPonto;
    derivado=true;
  }
  const t=emptyForm();
  t.data=extraiData(g('data'))||extraiData(g('hora_entrada'))||today();
  t.hora_entrada=extraiHora(g('hora_entrada'));
  t.hora_saida=extraiHora(g('hora_saida'));
  t.janela=classifyJanela(t.hora_entrada);
  const ativo=String(g('par')||'').toUpperCase().replace(/[^A-Z]/g,'');
  t.par=J().pairs.find(p=>ativo.startsWith(p))||ativo.slice(0,6)||J().pairs[0]||'';
  t.direcao=extraiDirecao(g('direcao'))||extraiDirecao(g('qtd'));
  let q=numBR(g('qtd'));
  if(!q){ // tenta a coluna do outro lado, quando o relatório separa compra e venda
    const alt=(map.qtd!==undefined?map.qtd+1:-1);
    if(alt>=0&&alt<r.length)q=numBR(r[alt]);
  }
  t.qtd=q;
  t.preco_entrada=numBR(g('preco_entrada'));
  t.preco_saida=numBR(g('preco_saida'));
  t.resultado=pnl===null?'':pnl>0?'Win':pnl<0?'Loss':'BE';
  t.pnl=pnl===null?0:pnl;
  t.pontos_resultado=pts;
  t.pnlDerivado=derivado;
  t.importado=true;
  t.revisado=false;
  return t;
}
function chaveTrade(t){return `${t.data}|${t.hora_entrada}|${Number(t.pnl).toFixed(2)}`;}

function abrirImport(){
  imp={etapa:'arquivo',head:[],rows:[],map:{},nome:'',valorPonto:J().valorPonto||null};
  render();
}
function fecharImport(){imp=null;render();}
function decodeCSV(buf){
  let txt=new TextDecoder('utf-8',{fatal:false}).decode(buf);
  // se aparecer caractere de substituição, o arquivo é latin-1 (padrão das corretoras)
  if(txt.includes('\uFFFD')||/Ã§|Ã£|Ã©|Ãµ/.test(txt)){
    try{txt=new TextDecoder('iso-8859-1').decode(buf);}catch{}
  }
  return txt;
}
function lerCSV(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const p=parseCSV(decodeCSV(e.target.result));
    if(!p||!p.rows.length){alert('Não consegui ler esse arquivo. Confira se é o CSV exportado do relatório.');return;}
    imp={etapa:'mapear',head:p.head,rows:p.rows,map:autoMap(p.head),nome:f.name,valorPonto:J().valorPonto||null};
    render();
  };
  r.readAsArrayBuffer(f);
}
function setMap(k,v){imp.map[k]=v===''?undefined:Number(v);render();}
function setValorPonto(v){
  const n=parseFloat(String(v).replace(',','.'));
  imp.valorPonto=isNaN(n)||n<=0?null:n;
  J().valorPonto=imp.valorPonto;save();render();
}
function confirmarImport(){
  const j=J();
  const existentes=new Set(j.trades.map(chaveTrade));
  let novos=0,dup=0,ruins=0;
  imp.rows.forEach(r=>{
    const t=linhaParaTrade(r,imp.map,{valorPonto:imp.valorPonto});
    if(!t.resultado||!t.data){ruins++;return;}
    if(existentes.has(chaveTrade(t))){dup++;return;}
    existentes.add(chaveTrade(t));
    j.trades.push(t);novos++;
  });
  j.trades.sort((a,b)=>{
    const da=parseDate(b.data)-parseDate(a.data);
    if(da)return da;
    return String(b.hora_entrada||'').localeCompare(String(a.hora_entrada||''));
  });
  save();
  imp=null;render();
  alert(`${novos} trade(s) importado(s).${dup?`\n${dup} já existiam e foram ignorados.`:''}${ruins?`\n${ruins} linha(s) sem resultado foram puladas.`:''}`);
}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIASEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function dayMap(){
  const m={};
  J().trades.forEach(t=>{
    const d=parseDate(t.data);if(!d)return;
    const k=dkey(d);
    if(!m[k])m[k]={pnl:0,n:0,w:0,l:0};
    m[k].pnl+=Number(t.pnl)||0;m[k].n++;
    if(t.resultado==='Win')m[k].w++;
    if(t.resultado==='Loss')m[k].l++;
  });
  return m;
}
function monthSummary(dm,y,mo){
  let pnl=0,n=0,w=0,dias=0,verde=0,verm=0,best=null,worst=null;
  Object.entries(dm).forEach(([k,v])=>{
    const [yy,mm,dd]=k.split('-').map(Number);
    if(yy!==y||mm-1!==mo)return;
    pnl+=v.pnl;n+=v.n;w+=v.w;dias++;
    if(v.pnl>0)verde++;else if(v.pnl<0)verm++;
    const date=new Date(yy,mm-1,dd);
    if(!best||v.pnl>best.pnl)best={pnl:v.pnl,date};
    if(!worst||v.pnl<worst.pnl)worst={pnl:v.pnl,date};
  });
  return{pnl,n,w,dias,verde,verm,best,worst,wr:n?Math.round(w/n*100):0};
}
function calNav(dir){
  if(ui.calView==='ano'){ui.calYear+=dir;}
  else{ui.calMonth+=dir;if(ui.calMonth<0){ui.calMonth=11;ui.calYear--;}if(ui.calMonth>11){ui.calMonth=0;ui.calYear++;}}
  render();
}
function calSetView(v){ui.calView=v;render();}
function calOpenMonth(m){ui.calMonth=m;ui.calView='mes';render();}
function calOpenDay(k){
  const [y,m,d]=k.split('-');
  ui.tab='journal';
  ui.filter.dataPreset='';ui.filter.dataIni='';ui.filter.dataFim='';ui.filter.mesRef='';
  ui._dayFilter=`${d}/${m}/${y}`;
  render();
}
function fmtDia(date){return `${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][date.getDay()]}-feira, ${date.getDate()}`.replace('domingo-feira','domingo').replace('sábado-feira','sábado');}

  }

  else{

    let yp=0,yn=0,yw=0,ydias=0;
    const cards=MESES.map((nome,m)=>{
      const S=monthSummary(dm,y,m);
      yp+=S.pnl;yn+=S.n;yw+=S.w;ydias+=S.dias;
      const first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();
      let cells='';
      DIASEM.forEach(d=>cells+=`<div style="text-align:center;color:#334155;font-size:8px;font-weight:700">${d[0]}</div>`);
      for(let i=0;i<first;i++)cells+=`<div></div>`;

        const v=dm[dkey(new Date(y,m,d))];
        const bg=!v?'transparent':v.pnl>0?'#22c55e':v.pnl<0?'#ef4444':'#f59e0b';
        cells+=`<div class="mini-cell" style="background:${bg};color:${v?'#060d1f':'#334155'}">${d}</div>`;
      }
      return `<div class="card" style="cursor:pointer;margin:0" onclick="calOpenMonth(${m})">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-weight:800">${nome}</div>
          <div style="font-weight:700;font-size:13px;color:${S.pnl>0?'#22c55e':S.pnl<0?'#ef4444':'#334155'}">${S.dias?(S.pnl>0?'+':'')+fmt(S.pnl):'—'}</div>
        </div>
        <div class="mini-grid">${cells}</div>
        <div style="border-top:1px solid #1e3a5f;margin-top:10px;padding-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center">
          <div><div style="font-weight:700">${S.n}</div><div style="color:#475569;font-size:9px">Trades</div></div>
          <div><div style="font-weight:700">${S.n?S.wr+'%':'—'}</div><div style="color:#475569;font-size:9px">Win Rate</div></div>
          <div><div style="font-weight:700">${S.dias}</div><div style="color:#475569;font-size:9px">Dias</div></div>
        </div>
      </div>`;
    });
    html+=`<div class="card">
      <div style="color:#475569;font-size:10px;font-weight:700;letter-spacing:0.8px">RESULTADO DO ANO</div>
      <div style="font-weight:800;font-size:30px;margin:4px 0;color:${yp>0?'#22c55e':yp<0?'#ef4444':'#f1f5f9'}">${yp>0?'+':''}${fmt(yp)}</div>
      <div style="color:#64748b;font-size:13px">${yn} trades em ${ydias} dias operados · acerto ${yn?Math.round(yw/yn*100):0}%</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${cards.join('')}</div>`;
  }
  return html;
}

// ACTIONS

function switchJournal(k){
  activeJournal=k;ui.showForm=false;ui.openTrades={};ui._editIdx=null;
  ui.filter={setup:'',resultado:'',par:'',dataPreset:'',dataIni:'',dataFim:'',mesRef:'',diaSemana:'',janela:'',revisar:'',dataPreset:'',dataIni:'',dataFim:'',mesRef:'',regioes:[],gatilhos:[],confluencias:[],filtros:[],filtrosOk:''};
  ui.formData=emptyForm();save();render();
}
function toggleSb(){ui.sbOpen=!ui.sbOpen;render();}
function toggleJournal(){const ks=Object.keys(JOURNALS);switchJournal(ks[(ks.indexOf(activeJournal)+1)%ks.length]);}
function setTab(t){ui.tab=t;ui.sbOpen=false;if(t!=='journal'){ui._revisao=false;ui.showForm=false;}if(t!=='journal')ui._dayFilter=null;render();}
function showForm(){ui.showForm=true;ui.formMode='manual';ui.formTxt='';ui.formImg=null;ui.formErr='';ui.formData=emptyForm();ui._editIdx=null;render();}
function hideForm(){ui.showForm=false;ui.formImg=null;ui._editIdx=null;ui._revisao=false;render();}
function setFormMode(m){ui.formMode=m;render();}
function setFormTxt(v){ui.formTxt=v;}
function setFD(k,v){ui.formData[k]=v;render();}
function setFDq(k,v){ui.formData[k]=v;}
function setHora(k,v){
  ui.formData[k]=v;
  const el=document.getElementById('janela-calc');
  if(el){
    const n=classifyJanela(ui.formData.hora_entrada);

function addParcial(){
  const ps=ui.formData.parciais||[];
  if(ps.length>=4)return;
  ui.formData.parciais=[...ps,{pontos:'',contratos:'',pct:''}];render();
}
function delParcial(i){ui.formData.parciais=(ui.formData.parciais||[]).filter((_,j)=>j!==i);render();}
function setParcial(i,k,v){
  const ps=[...(ui.formData.parciais||[])];
  if(!ps[i])return;
  ps[i]={...ps[i],[k]:v};ui.formData.parciais=ps;
}
function setPontos(k,v){
  ui.formData[k]=v;
  const el=document.getElementById('rr-calc');
  if(el){
    const r=rrPlan(ui.formData);
    el.textContent=r?`1 : ${r}`:'—';
    el.style.color=r?'#22c55e':'#334155';
  }
}
function toggleFD(k){
  if(k==='lt_rompimento_forte')ui.formData[k]=ui.formData[k]===true?false:true;
  else ui.formData[k]=!ui.formData[k];
  if(k==='saiu_parcial'&&ui.formData.saiu_parcial&&!(ui.formData.parciais||[]).length)
    ui.formData.parciais=[{pontos:'',contratos:'',pct:''}];
  render();
}
function toggleInList(field,val){
  const c=ui.formData[field]||[];
  ui.formData[field]=c.includes(val)?c.filter(x=>x!==val):[...c,val];
  render();
}
function toggleFiltro(i){const v=J().filters[i];if(v!==undefined)toggleInList('filtros',v);}
function toggleRegiao(i){const v=J().regions[i];if(v!==undefined)toggleInList('regioes',v);}
function toggleGatilho(i){const v=J().triggers[i];if(v!==undefined)toggleInList('gatilhos',v);}
function toggleConfluencia(i){const v=J().confluences[i];if(v!==undefined)toggleInList('confluencias',v);}
function toggleConf(i){const v=FIBO_CONF[i];if(v!==undefined)toggleInList('bt_confluencias',v);}
function setFilter(k,v){ui.filter[k]=v;render();}
function setPreset(v){
  ui.filter.dataPreset=v;
  if(v!=='mesref')ui.filter.mesRef='';
  if(v!=='intervalo'){ui.filter.dataIni='';ui.filter.dataFim='';}
  if(v==='mesref'&&!ui.filter.mesRef){const d=new Date();ui.filter.mesRef=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
