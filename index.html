<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Diário Zella</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1f;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;padding:20px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:4px}
input::placeholder,textarea::placeholder{color:#334155}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #334155;border-top:2px solid #6366f1;border-radius:50%;animation:spin 0.8s linear infinite}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.card{background:#0d1526;border-radius:12px;border:1px solid #1e3a5f;padding:16px;margin-bottom:12px}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary:disabled{background:#1e3a5f;cursor:not-allowed;opacity:0.5}
.btn-ghost{background:none;border:1px solid #1e3a5f;border-radius:8px;color:#64748b;padding:8px 14px;cursor:pointer;font-size:12px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#475569;padding:11px 18px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.tab.active{border-bottom-color:#6366f1;color:#6366f1}
select,input[type=text],input[type=number],input[type=date],textarea{background:#060d1f;border:1px solid #1e3a5f;border-radius:8px;color:#f1f5f9;font-size:13px;padding:8px 10px;outline:none;width:100%;font-family:inherit}
select option{background:#0d1526}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.label{color:#64748b;font-size:11px;display:block;margin-bottom:4px}
.section-label{font-size:10px;font-weight:700;letter-spacing:0.8px;margin-bottom:10px}
.trade-card{background:#0b1220;border-radius:12px;margin-bottom:8px;overflow:hidden}
.trade-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap;gap:8px;cursor:pointer}
.trade-detail{padding:12px 16px;border-top:1px solid #1e3a5f;display:grid;gap:10px}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle-track{width:36px;height:20px;border-radius:10px;position:relative;transition:background 0.2s;flex-shrink:0;cursor:pointer}
.toggle-thumb{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left 0.2s}
.alert{background:#2d0606;border:1px solid #ef4444;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.stats-bar{background:#08111f;border-bottom:1px solid #1e3a5f;padding:10px 20px;display:flex;gap:24px;overflow-x:auto}
.metric{background:#0d1526;border-radius:10px;padding:12px 14px;border:1px solid #1e3a5f}
.chat-msg{max-width:85%;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;white-space:pre-wrap;margin-bottom:8px}
.img-preview{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid #1e3a5f}
.capital-input{background:#060d1f;border:1px solid #6366f1;border-radius:8px;color:#6366f1;font-size:14px;font-weight:700;padding:4px 8px;width:100px;outline:none;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── CONSTANTS ──────────────────────────────────────────────────────
const ALL_PAIRS=['US30','EURUSD','GBPUSD','BTC','US500','USOIL','XAGUSD','GBPJPY','NASDAQ','XAUUSD','AUDUSD'];
const PAUSED=['AUDUSD','XAUUSD'];
const SETUPS=['Pivot','Fibo'];
const FIBO_LVL=['50','61.8','73.6'];
const TFS=['M2','M5'];
const SESS=['Manhã','Tarde','Noite','Madrugada'];
const EMOTS=['Neutro','Confiante','Ansioso','Com medo','Empolgado','Frustrado','Impaciente','Calmo'];
const RESULTS=['Win','Loss','BE'];
const FIBO_CONF=['MM20','MM50','LT','PB LT','CHoCH'];
const RETEST=['Acima do nível','Tocou','Quebrou e voltou','Invalidou'];
const LT_STR=['Forte','Fraco'];
const CTXS=['Tendência','Lateral','Pós-notícia'];
const TGTS=['0.382','0 (alvo)','Rompeu','Saiu antes'];
const WEEKDAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const RC={Win:'#22c55e',Loss:'#ef4444',BE:'#f59e0b'};
const EC={Neutro:'#64748b',Confiante:'#22c55e',Ansioso:'#f59e0b','Com medo':'#ef4444',Empolgado:'#6366f1',Frustrado:'#ef4444',Impaciente:'#f59e0b',Calmo:'#22c55e'};

// ── STATE ──────────────────────────────────────────────────────────
let state={
  tab:'journal',
  trades:[],
  showForm:false,
  filter:{setup:'',resultado:'',par:'',periodo:'',diaSemana:''},
  formMode:'texto',
  formTxt:'',
  formData:emptyForm(),
  formLoading:false,
  formErr:'',
  openTrades:{},
  capital:200,
  chatOpen:false,
};

function emptyForm(){
  return {par:'',setup:'',direcao:'',resultado:'',pnl:'',rr_realizado:'',fibo_nivel:'',timeframe:'',sessao:'',emocao:'',seguiu_regras:true,moveu_be_cedo:false,tinha_confluencia:true,lt_rompimento_forte:null,erros:'',acertos:'',data:today(),notas:'',resumo_ia:'',score:null,imagem:null,
  // backtest fields (only used when setup=Fibo)
  bt_confluencias:[],bt_tinha_lt_choch:false,bt_retestou:false,bt_tipo_retest:'',bt_mm_proxima:false,bt_mm_respeitou:'',bt_candles_ate_alvo:'',bt_lt_forca:'',bt_ate_onde_foi:'',bt_saiu_antes:false,bt_motivo_saiu:'',bt_contexto:''};
}

// load
try{const t=localStorage.getItem('zt2');if(t)state.trades=JSON.parse(t);}catch{}
try{const c=localStorage.getItem('zc');if(c)state.capital=parseFloat(c);}catch{}

function save(){
  try{localStorage.setItem('zt2',JSON.stringify(state.trades));}catch{}
  try{localStorage.setItem('zc',String(state.capital));}catch{}
}

// ── HELPERS ────────────────────────────────────────────────────────
function today(){return new Date().toLocaleDateString('pt-BR');}
function weekday(s){if(!s)return'';const[d,m,y]=s.split('/');try{return['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(`${y}-${m}-${d}`).getDay()]||'';}catch{return'';}}
function fmt(n){if(n===null||n===undefined||n==='')return'—';const x=Number(n);return`${x>=0?'':'-'}$${Math.abs(x).toFixed(2)}`;}
function getDailyPnl(trades){return trades.filter(t=>t.data===today()).reduce((s,t)=>s+(t.pnl||0),0);}
function getConsec(trades){let c=0;for(const t of trades.filter(t=>t.data===today())){if(t.resultado==='Loss')c++;else break;}return c;}
function calcStats(trades){
  if(!trades.length)return null;
  const wins=trades.filter(t=>t.resultado==='Win');
  const losses=trades.filter(t=>t.resultado==='Loss');
  const totalPnl=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const gw=wins.reduce((s,t)=>s+(t.pnl||0),0);
  const gl=Math.abs(losses.reduce((s,t)=>s+(t.pnl||0),0));
  const pf=gl>0?(gw/gl).toFixed(2):wins.length>0?'∞':'—';
  const rrs=trades.filter(t=>t.rr_realizado);
  const avgRR=rrs.length?(rrs.reduce((s,t)=>s+t.rr_realizado,0)/rrs.length).toFixed(2):'—';
  return{totalPnl,wins:wins.length,losses:losses.length,winRate:Math.round((wins.length/trades.length)*100),pf,avgRR};
}
function maxDailyLoss(){return state.capital*0.03;}
function riskPerTrade(){return state.capital*0.005;}

function getPARSE_PROMPT(){
  return `Você é especialista em trades Forex/Futuros/Cripto. Setups: Pivot (RR 1:1) e Fibo (RR mín 3.5). Capital $${state.capital}, risco $${riskPerTrade().toFixed(2)}/trade, perda máx $${maxDailyLoss().toFixed(2)}/dia. Exness Zero Spread, TradingView, M2/M5.
Extraia o trade e retorne SOMENTE JSON sem markdown:
{"par":"EURUSD","setup":"Pivot","direcao":"Compra","resultado":"Win","pnl":${riskPerTrade().toFixed(2)},"rr_realizado":1,"fibo_nivel":null,"timeframe":"M5","sessao":"Manhã","emocao":"Neutro","seguiu_regras":true,"moveu_be_cedo":false,"tinha_confluencia":true,"lt_rompimento_forte":null,"erros":null,"acertos":null,"data":"${today()}","notas":null,"resumo_ia":"análise aqui","score":7}`;
}

function getCHAT_SYS(){
  return `Você é a Zella, assistente de trading. Capital $${state.capital}, risco $${riskPerTrade().toFixed(2)} (0,5%), perda máx $${maxDailyLoss().toFixed(2)}/dia. Setups: Pivot (RR 1:1) e Fibo (RR mín 3.5). 3 losses ou -$${maxDailyLoss().toFixed(2)} = encerra. Pares Pivot: US30,EURUSD,GBPUSD,BTC,US500,USOIL,XAGUSD. Fibo: todos exceto AUDUSD/XAUUSD. Aprendizados: BE precoce destruiu agosto; US30 melhor par Pivot (62% WR); quintas melhores; quartas cuidado. Responda em português, direto e prático.`;
}

// ── UI HELPERS ─────────────────────────────────────────────────────
function badge(text,color){return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${escHtml(String(text))}</span>`;}
function toggle(checked,onchange,label){return `<label class="toggle-wrap"><div class="toggle-track" style="background:${checked?'#6366f1':'#1e3a5f'}" onclick="${onchange}"><div class="toggle-thumb" style="left:${checked?18:3}px"></div></div>${label?`<span style="color:#94a3b8;font-size:13px">${label}</span>`:''}</label>`;}
function sel(val,opts,onchange,placeholder=''){return `<select onchange="${onchange}"><option value="">${placeholder}</option>${opts.map(o=>`<option value="${escHtml(o)}"${val===o?'selected':''}>${escHtml(o)}</option>`).join('')}</select>`;}
function inp(val,onchange,placeholder='',type='text'){return `<input type="${type}" value="${escHtml(String(val||''))}" oninput="${onchange}" placeholder="${placeholder}">`;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── RENDER ─────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const dpnl=getDailyPnl(state.trades);
  const cl=getConsec(state.trades);
  const stats=calcStats(state.trades);
  const tod=state.trades.filter(t=>t.data===today());
  const MDL=maxDailyLoss();
  const RPT=riskPerTrade();

  // apply filters
  const filtered=state.trades.filter(t=>{
    if(state.filter.setup&&t.setup!==state.filter.setup)return false;
    if(state.filter.resultado&&t.resultado!==state.filter.resultado)return false;
    if(state.filter.par&&t.par!==state.filter.par)return false;
    if(state.filter.diaSemana&&weekday(t.data)!==state.filter.diaSemana)return false;
    if(state.filter.periodo){
      const[d,m,y]=(t.data||'').split('/');
      try{if(new Date(`${y}-${m}-${d}`)<new Date(Date.now()-parseInt(state.filter.periodo)*86400000))return false;}catch{}
    }
    return true;
  });

  // ── HEADER
  let html=`
  <div style="background:#080f23;border-bottom:1px solid #1e3a5f;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;margin:-20px -20px 0;position:sticky;top:0;z-index:100">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px">Z</div>
      <div>
        <div style="font-weight:800;font-size:16px">Diário <span style="color:#6366f1">Zella</span></div>
        <div style="color:#334155;font-size:10px">Exness Zero · TradingView · M2/M5</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#475569;font-size:11px">Capital:</span>
        <input class="capital-input" type="number" value="${state.capital}" onchange="updateCapital(this.value)" title="Altere seu capital aqui">
      </div>
      <label class="btn-ghost" style="font-size:11px;padding:6px 12px;cursor:pointer">📥 Importar<input type="file" accept=".json" onchange="importJ(event)" style="display:none;width:auto"></label>
      <button class="btn-ghost" onclick="exportJ()" style="font-size:11px;padding:6px 12px">📤 Exportar</button>
    </div>
  </div>`;

  // ── STATS BAR
  html+=`<div class="stats-bar" style="margin:0 -20px">
    ${[
      ['P&L Total',fmt(stats?.totalPnl??0),(stats?.totalPnl??0)>=0?'#22c55e':'#ef4444'],
      ['Win Rate',stats?`${stats.winRate}%`:'—',(stats?.winRate??0)>=50?'#22c55e':'#ef4444'],
      ['Profit Factor',stats?.pf??'—',parseFloat(stats?.pf)>=1.5?'#22c55e':'#f59e0b'],
      ['Hoje',fmt(dpnl),dpnl>=0?'#22c55e':'#ef4444'],
      ['Losses consec.',cl,cl>=2?'#ef4444':'#f1f5f9'],
      ['Capital',`$${state.capital}`,'#6366f1'],
      ['Risco/trade',fmt(RPT),'#94a3b8'],
      ['Limite diário',fmt(MDL),'#f59e0b'],
    ].map(([l,v,c])=>`<div style="flex-shrink:0"><div style="color:#334155;font-size:10px;font-weight:600">${l}</div><div style="color:${c};font-weight:700;font-size:15px">${v}</div></div>`).join('')}
  </div>`;

  // ── ALERT
  if(dpnl<=-MDL||cl>=3){
    html+=`<div class="alert"><span style="font-size:20px">🛑</span><div><div style="color:#ef4444;font-weight:700;font-size:14px">ENCERRE O DIA AGORA</div><div style="color:#fca5a5;font-size:12px;margin-top:2px">${cl>=3?`${cl} losses consecutivos. `:''}${dpnl<=-MDL?`Perda ${fmt(dpnl)} atingida. `:''}Fecha o gráfico. Vai fazer exercício ou tocar violão. 🎸</div></div></div>`;
  }

  // ── TABS
  html+=`<div style="background:#080f23;border-bottom:1px solid #1e3a5f;display:flex;overflow-x:auto;margin:0 -20px">
    ${[['journal','📝 Diário'],['stats','📊 Stats']].map(([id,label])=>`<button class="tab${state.tab===id?' active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}
  </div><div style="max-width:860px;margin:0 auto;padding-top:20px">`;

  // ══════════════════════════════════════════════
  // JOURNAL TAB
  // ══════════════════════════════════════════════
  if(state.tab==='journal'){

    // ── FORM
    if(!state.showForm){
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="color:#475569;font-size:12px">${state.trades.length} trades · ${tod.length} hoje</div>
        <button class="btn-primary" onclick="showForm()">+ Registrar Trade</button>
      </div>`;
    } else {
      html+=renderForm(RPT);
    }

    // ── FILTERS
    html+=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <select onchange="setFilter('setup',this.value)" style="width:auto"><option value="">Setup: Todos</option>${SETUPS.map(o=>`<option value="${o}"${state.filter.setup===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="setFilter('resultado',this.value)" style="width:auto"><option value="">Resultado: Todos</option>${RESULTS.map(o=>`<option value="${o}"${state.filter.resultado===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="setFilter('par',this.value)" style="width:auto"><option value="">Par: Todos</option>${[...new Set(state.trades.map(t=>t.par).filter(Boolean))].map(o=>`<option value="${o}"${state.filter.par===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="setFilter('diaSemana',this.value)" style="width:auto"><option value="">Dia: Todos</option>${WEEKDAYS.map(o=>`<option value="${o}"${state.filter.diaSemana===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="setFilter('periodo',this.value)" style="width:auto"><option value="">Período: Todos</option>${[['7','7 dias'],['30','30 dias'],['90','90 dias']].map(([v,l])=>`<option value="${v}"${state.filter.periodo===v?'selected':''}>${l}</option>`).join('')}</select>
      ${Object.values(state.filter).some(Boolean)?`<button class="btn-ghost" onclick="clearFilter()" style="font-size:11px">✕ Limpar</button>`:''}
      <span style="color:#334155;font-size:11px">${filtered.length} trade${filtered.length!==1?'s':''}</span>
    </div>`;

    // ── TRADE LIST
    if(!filtered.length&&!state.showForm){
      html+=`<div style="text-align:center;padding:48px 24px;color:#334155;background:#0d1526;border-radius:14px;border:1px dashed #1e3a5f">
        <div style="font-size:36px;margin-bottom:10px">📈</div>
        <div style="font-weight:700;font-size:15px;margin-bottom:6px;color:#475569">${state.trades.length===0?'Nenhum trade ainda':'Sem trades com esse filtro'}</div>
        <div style="font-size:13px">${state.trades.length===0?'Clique em "+ Registrar Trade"':'Tente ajustar os filtros'}</div>
      </div>`;
    }

    filtered.forEach(t=>{
      const idx=state.trades.indexOf(t);
      const open=state.openTrades[idx];
      const rc=RC[t.resultado]||'#64748b';
      const ec=EC[t.emocao]||'#64748b';
      html+=`<div class="trade-card" style="border:1px solid ${t.resultado==='Win'?'#22c55e33':t.resultado==='Loss'?'#ef444433':'#1e3a5f'}">
        <div class="trade-row" onclick="toggleTrade(${idx})">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            ${badge(t.resultado,rc)}
            <span style="font-weight:700;color:#f1f5f9;font-size:14px">${escHtml(t.par||'')}</span>
            ${badge(t.setup||'','#334155')}
            ${t.fibo_nivel?badge('Fibo '+t.fibo_nivel,'#6366f1'):''}
            ${t.direcao?badge(t.direcao,t.direcao==='Compra'?'#22c55e':'#ef4444'):''}
            <span style="color:#475569;font-size:11px">${escHtml(t.data||'')}${weekday(t.data)?' · '+weekday(t.data):''}</span>
            ${t.sessao?`<span style="color:#475569;font-size:11px">· ${escHtml(t.sessao)}</span>`:''}
            ${t.emocao?`<span style="color:${ec};font-size:11px;font-weight:600">● ${escHtml(t.emocao)}</span>`:''}
            ${t.moveu_be_cedo?badge('BE precoce ⚠','#f59e0b'):''}
            ${!t.seguiu_regras?badge('Fora do plano','#ef4444'):''}
            ${t.imagem?'<span style="color:#6366f1;font-size:11px">📷</span>':''}
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:${rc};font-weight:700;font-size:15px">${fmt(t.pnl)}</span>
            ${t.rr_realizado?`<span style="color:#64748b;font-size:11px">R:${t.rr_realizado}</span>`:''}
            <button onclick="event.stopPropagation();editTrade(${idx})" style="background:none;border:none;color:#475569;cursor:pointer;font-size:13px;padding:2px 6px" title="Editar">✏️</button>
            <button onclick="event.stopPropagation();deleteTrade(${idx})" style="background:none;border:none;color:#334155;cursor:pointer;font-size:18px;padding:0">×</button>
          </div>
        </div>
        ${open?renderTradeDetail(t,idx):''}
      </div>`;
    });
  }

  // ══════════════════════════════════════════════
  // STATS TAB
  // ══════════════════════════════════════════════
  else if(state.tab==='stats'){
    html+=renderStats();
  }

  html+=`</div>`;

  // ── CLAUDE CHAT BUTTON (fixed)
  html+=`<div style="position:fixed;bottom:20px;right:20px;z-index:200">
    <button onclick="openClaude()" class="btn-primary" style="border-radius:50px;padding:12px 20px;box-shadow:0 4px 20px #6366f166">
      💬 Perguntar à Zella
    </button>
  </div>`;

  app.innerHTML=html;
}

// ── FORM RENDERER ──────────────────────────────────────────────────
function renderForm(RPT){
  const f=state.formData;
  let html=`<div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      ${['texto','manual'].map(m=>`<button onclick="setFormMode('${m}')" style="background:${state.formMode===m?'#6366f1':'transparent'};border:1px solid ${state.formMode===m?'#6366f1':'#1e3a5f'};border-radius:8px;color:${state.formMode===m?'#fff':'#64748b'};padding:7px 16px;cursor:pointer;font-size:12px;font-weight:600">${m==='texto'?'✍️ Descrever':'📋 Preencher'}</button>`).join('')}
    </div>`;

  if(state.formMode==='texto'){
    html+=`<textarea id="formtxt" oninput="setFormTxt(this.value)" placeholder="Descreva o trade:&#10;&#10;&quot;Pivot compra EURUSD M5, win, confiante, segui o setup&quot;&#10;&quot;Fibo 61.8 US30, venda, loss, movi BE cedo demais&quot;" style="width:100%;min-height:100px;resize:vertical">${escHtml(state.formTxt)}</textarea>
      ${state.formErr?`<div style="color:#ef4444;font-size:12px;margin-top:6px">⚠ ${state.formErr}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span style="color:#334155;font-size:11px">Ctrl+Enter para analisar</span>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" onclick="hideForm()">Cancelar</button>

      </div>

      ${state.formErr?`<div style="color:#ef4444;font-size:12px">⚠ ${state.formErr}</div>`:''}
      <div style="display:flex;justify-content:flex-end;gap:8px">

        <button class="btn-ghost" onclick="hideForm()">Cancelar</button>
        <button class="btn-primary" onclick="saveTrade()">💾 Salvar Trade</button>

  }
  html+=`</div>`;
  return html;
}

function renderStats(){
  if(!state.trades.length)return`<div style="text-align:center;padding:48px;color:#334155"><div style="font-size:36px;margin-bottom:10px">📊</div>Registre trades para ver as estatísticas</div>`;
  const s=calcStats(state.trades);
  let html=`<div class="grid3" style="margin-bottom:14px">
    ${[
      ['P&L TOTAL',fmt(s.totalPnl),s.totalPnl>=0?'#22c55e':'#ef4444',''],
      ['WIN RATE',`${s.winRate}%`,s.winRate>=50?'#22c55e':'#ef4444',`${s.wins}W · ${s.losses}L`],
      ['PROFIT FACTOR',s.pf,parseFloat(s.pf)>=1.5?'#22c55e':'#f59e0b',''],
      ['RR MÉDIO',`1:${s.avgRR}`,'#f1f5f9',''],
      ['TRADES',state.trades.length,'#f1f5f9',''],
      ['SCORE MÉDIO',`${(state.trades.reduce((a,t)=>a+(t.score||5),0)/state.trades.length).toFixed(1)}/10`,'#6366f1',''],
    ].map(([l,v,c,sub])=>`<div class="metric"><div style="color:#475569;font-size:10px;font-weight:600;margin-bottom:3px">${l}</div><div style="color:${c};font-weight:700;font-size:18px">${v}</div>${sub?`<div style="color:#475569;font-size:11px;margin-top:2px">${sub}</div>`:''}</div>`).join('')}
  </div>`;

  function groupStats(arr,key){
    const g={};arr.forEach(t=>{const k=t[key]||'—';if(!g[k])g[k]=[];g[k].push(t);});
    return Object.entries(g).map(([label,ts])=>{
      const w=ts.filter(t=>t.resultado==='Win').length;
      const l=ts.filter(t=>t.resultado==='Loss').length;
      const p=ts.reduce((s,t)=>s+(t.pnl||0),0);
      return{label,w,l,p,wr:ts.length?Math.round((w/ts.length)*100):0};
    }).sort((a,b)=>b.p-a.p);
  }

  function tTable(title,rows,color='#6366f1'){
    return`<div class="card"><div class="section-label" style="color:${color}">${title}</div>
      <div style="display:grid;grid-template-columns:1fr 40px 40px 60px 50px;gap:8px;margin-bottom:6px">${['','W','L','P&L','WR'].map(h=>`<span style="color:#475569;font-size:10px;font-weight:700">${h}</span>`).join('')}</div>
      ${rows.map(r=>`<div style="display:grid;grid-template-columns:1fr 40px 40px 60px 50px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #1e3a5f">
        <span style="color:#f1f5f9;font-size:13px">${escHtml(r.label)}</span>
        <span style="color:#22c55e;font-size:12px;text-align:center">${r.w}W</span>
        <span style="color:#ef4444;font-size:12px;text-align:center">${r.l}L</span>
        <span style="color:${r.p>=0?'#22c55e':'#ef4444'};font-size:12px;font-weight:700">${fmt(r.p)}</span>
        <span style="color:${r.wr>=50?'#22c55e':'#f59e0b'};font-size:12px">${r.wr}%</span>
      </div>`).join('')}
    </div>`;
  }

  html+=tTable('💱 POR PAR',groupStats(state.trades,'par'));
  html+=tTable('📐 POR SETUP',groupStats(state.trades,'setup'));

  const fiboTrades=state.trades.filter(t=>t.setup==='Fibo');
  if(fiboTrades.length){
    html+=tTable('🎯 FIBO POR NÍVEL',groupStats(fiboTrades,'fibo_nivel').map(r=>({...r,label:'Fibo '+r.label})));

    // Backtest summary
    const wLT=fiboTrades.filter(c=>c.bt_tinha_lt_choch).length;
    const wTgt=fiboTrades.filter(c=>c.bt_ate_onde_foi==='0 (alvo)'||c.bt_ate_onde_foi==='Rompeu').length;
    html+=`<div class="card"><div class="section-label" style="color:#6366f1">🔬 ANÁLISE FIBO (${fiboTrades.length} operações)</div>
      <div class="grid3">
        ${[['Com LT/CHoCH',`${wLT}/${fiboTrades.length}`,'#22c55e'],['Atingiu alvo',`${wTgt}/${fiboTrades.length}`,'#f59e0b'],['BE precoce→Loss',fiboTrades.filter(t=>t.moveu_be_cedo&&t.resultado==='Loss').length,'#ef4444']].map(([l,v,c])=>`<div style="background:#060d1f;border-radius:8px;padding:10px 12px"><div style="color:#475569;font-size:10px">${l}</div><div style="color:${c};font-weight:700;font-size:16px">${v}</div></div>`).join('')}
      </div>
    </div>`;
  }

  html+=tTable('🧠 POR EMOÇÃO',groupStats(state.trades,'emocao'));

  // Day of week
  const dg={};
  state.trades.forEach(t=>{
    const[d,m,y]=(t.data||'').split('/');
    if(!d)return;
    try{const day=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(`${y}-${m}-${d}`).getDay()]||'?';
    if(!dg[day])dg[day]={w:0,l:0,p:0};
    if(t.resultado==='Win')dg[day].w++;if(t.resultado==='Loss')dg[day].l++;dg[day].p+=(t.pnl||0);}catch{}
  });
  const dayRows=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].filter(d=>dg[d]).map(d=>({label:d+(d==='Qua'?' ⚠':''),...dg[d],wr:Math.round((dg[d].w/(dg[d].w+dg[d].l||1))*100)}));
  if(dayRows.length)html+=tTable('📅 POR DIA DA SEMANA',dayRows);

  const bePnl=state.trades.filter(t=>t.moveu_be_cedo&&t.resultado==='Loss').length;
  const noRule=state.trades.filter(t=>!t.seguiu_regras).length;
  const weakLT=state.trades.filter(t=>t.lt_rompimento_forte===false&&t.resultado==='Loss').length;
  html+=`<div class="card"><div class="section-label" style="color:#f59e0b">⚠ ALERTAS DE DISCIPLINA</div>
    ${[['BE precoce → Loss',bePnl,'BE cedo resultou em loss'],['Fora das regras',noRule,'Trades fora do plano'],['LT fraca → Loss (Fibo)',weakLT,'Sem rompimento de LT forte']].map(([l,v,d])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e3a5f"><div><div style="color:#f1f5f9;font-size:13px">${l}</div><div style="color:#475569;font-size:11px">${d}</div></div><div style="color:${v>0?'#ef4444':'#22c55e'};font-weight:700;font-size:18px">${v}</div></div>`).join('')}
  </div>`;

  return html;
}

// ── ACTIONS ────────────────────────────────────────────────────────
function setTab(t){state.tab=t;render();}
function showForm(){state.showForm=true;state.formMode='texto';state.formTxt='';state.formErr='';state.formData=emptyForm();render();}
function hideForm(){state.showForm=false;render();}
function setFormMode(m){state.formMode=m;render();}
function setFormTxt(v){state.formTxt=v;}
function setFD(k,v){state.formData[k]=v;render();}
function toggleFD(k){
  if(k==='lt_rompimento_forte')state.formData[k]=state.formData[k]===true?false:true;
  else state.formData[k]=!state.formData[k];
  render();
}
function toggleConf(o){
  const c=state.formData.bt_confluencias||[];
  state.formData.bt_confluencias=c.includes(o)?c.filter(x=>x!==o):[...c,o];
  render();
}
function setFilter(k,v){state.filter[k]=v;render();}
function clearFilter(){state.filter={setup:'',resultado:'',par:'',periodo:'',diaSemana:''};render();}
function toggleTrade(i){state.openTrades[i]=!state.openTrades[i];render();}
function deleteTrade(i){if(confirm('Remover esse trade?')){state.trades.splice(i,1);save();render();}}
function updateCapital(v){const n=parseFloat(v);if(n>0){state.capital=n;save();render();}}

function editTrade(i){
  state.formData={...emptyForm(),...state.trades[i]};
  state.formMode='manual';
  state.showForm=true;
  state._editIdx=i;
  state.formErr='';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function loadImage(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{state.formData.imagem=e.target.result;render();};
  reader.readAsDataURL(file);
}

async function parseForm(){
  const txt=state.formTxt||document.getElementById('formtxt')?.value||'';
  if(!txt.trim())return;
  state.formTxt=txt;
  state.formLoading=true;state.formErr='';render();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:getPARSE_PROMPT(),messages:[{role:'user',content:txt}]})});
    const d=await res.json();
    const raw=d.content?.map(i=>i.text||'').join('')||'';
    const p=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(!p.data)p.data=today();
    if(!p.pnl&&p.resultado==='Loss')p.pnl=-riskPerTrade();
    if(!p.pnl&&p.resultado==='Win')p.pnl=p.rr_realizado?riskPerTrade()*p.rr_realizado:riskPerTrade();
    state.formData={...emptyForm(),...p};
    state.formMode='manual';
  }catch{state.formErr='Não consegui interpretar. Tente descrever com mais detalhes.';}
  state.formLoading=false;render();
}

function saveTrade(){
  const f=state.formData;
  if(!f.par||!f.setup||!f.resultado){state.formErr='Preencha: par, setup e resultado.';render();return;}
  const trade={...f,pnl:Number(f.pnl)||0,rr_realizado:Number(f.rr_realizado)||null};
  if(state._editIdx!=null){
    state.trades[state._editIdx]=trade;
    state._editIdx=null;
  } else {
    state.trades.unshift(trade);
  }
  state.showForm=false;
  state.formData=emptyForm();
  save();render();
}

function exportJ(){
  const b=new Blob([JSON.stringify({trades:state.trades,capital:state.capital},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`diario-${today().replace(/\//g,'-')}.json`;a.click();
}

function importJ(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.trades)state.trades=d.trades;
      if(d.capital)state.capital=d.capital;
      save();render();
    }catch{alert('Arquivo inválido.');}
  };
  r.readAsText(f);
}

function openClaude(){
  const stats=calcStats(state.trades);
  const resumo=state.trades.slice(0,20).map(t=>`${t.data} ${t.par} ${t.setup} ${t.resultado} P&L:${fmt(t.pnl)} Emoção:${t.emocao||'—'} BEcedo:${t.moveu_be_cedo?'sim':'não'}`).join('\n');
  const txt=`Contexto do meu diário de trade:\n\nCapital: $${state.capital} | Risco/trade: ${fmt(riskPerTrade())} | Limite diário: ${fmt(maxDailyLoss())}\nSetups: Pivot (RR 1:1) e Fibo (RR mín 3.5)\nCorretora: Exness Zero Spread | TF: M2/M5\n\nEstatísticas:\nTotal trades: ${state.trades.length} | Win Rate: ${stats?.winRate??0}% | P&L: ${fmt(stats?.totalPnl??0)} | Profit Factor: ${stats?.pf??'—'}\n\nÚltimos trades:\n${resumo}\n\n---\nCom base nesses dados, me ajude a analisar minha performance.`;
  navigator.clipboard.writeText(txt).then(()=>{alert('Contexto copiado! Cole numa conversa com o Claude para análise completa.');}).catch(()=>{const w=window.open('','_blank');if(w)w.document.write(`<pre style="font-family:monospace;padding:20px;background:#111;color:#fff;white-space:pre-wrap">${txt}</pre>`);});
}

render();
</script>
</body>
