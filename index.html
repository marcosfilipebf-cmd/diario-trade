}
function toggleFilterList(field,val){
  const c=ui.filter[field]||[];
  ui.filter[field]=c.includes(val)?c.filter(x=>x!==val):[...c,val];
  render();
}
function toggleFilterConfl(i){const v=J().confluences[i];if(v!==undefined)toggleFilterList('confluencias',v);}
function toggleFilterRegiao(i){const v=J().regions[i];if(v!==undefined)toggleFilterList('regioes',v);}
function toggleFilterGatilho(i){const v=J().triggers[i];if(v!==undefined)toggleFilterList('gatilhos',v);}
function toggleFilterFiltro(i){const v=J().filters[i];if(v!==undefined)toggleFilterList('filtros',v);}
function clearFilter(){ui._dayFilter=null;ui.filter={setup:'',resultado:'',par:'',dataPreset:'',dataIni:'',dataFim:'',mesRef:'',diaSemana:'',janela:'',revisar:'',dataPreset:'',dataIni:'',dataFim:'',mesRef:'',regioes:[],gatilhos:[],confluencias:[],filtros:[],filtrosOk:''};render();}
function toggleTrade(i){ui.openTrades[i]=!ui.openTrades[i];render();}
function deleteTrade(i){if(confirm('Remover esse trade?')){J().trades.splice(i,1);save();render();}}
function updateCapital(v){const n=parseFloat(v);if(n>0){J().capital=n;save();render();}}
function resetTrades(){J().trades=[];ui.openTrades={};save();render();}
function resetLists(){
  const d=JOURNALS[activeJournal].defaults,j=J();
  ['pairs','paused','setups','results','timeframes','sessions','regions','triggers','filters','confluences'].forEach(k=>{j[k]=[...d[k]];});
  save();render();
}
function loadFormImg(event){
  const file=event.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{ui.formImg=e.target.result;render();};
  r.readAsDataURL(file);
}
function clearFormImg(){ui.formImg=null;render();}

function pendentes(){
  return J().trades.map((t,i)=>({t,i})).filter(x=>x.t.importado&&!x.t.revisado).map(x=>x.i);
}
function iniciarRevisao(){
  const p=pendentes();
  if(!p.length)return;
  ui._revisao=true;
  editTrade(p[0]);
}
function pularRevisao(dir){
  const p=pendentes();
  if(!p.length){ui._revisao=false;ui.showForm=false;render();return;}
  const atual=ui._editIdx;
  let pos=p.indexOf(atual);
  if(pos<0)pos=0;
  else pos=(pos+dir+p.length)%p.length;
  editTrade(p[pos]);
}
function sairRevisao(){ui._revisao=false;ui.showForm=false;ui._editIdx=null;render();}

function editTrade(i){
  const t=J().trades[i];
  if(!t)return;
  ui.formData={...emptyForm(),...t,
    parciais:(t.parciais||[]).map(p=>({...p})),
    regioes:[...(t.regioes||[])],
    gatilhos:[...(t.gatilhos||[])],
    filtros:[...(t.filtros||[])],
    confluencias:[...(t.confluencias||[])],
    bt_confluencias:[...(t.bt_confluencias||[])]
  };
  ui.formMode='manual';
  ui.showForm=true;
  ui._editIdx=i;
  ui.formErr='';
  ui.tab='journal';
  render();
  try{window.scrollTo({top:0,behavior:'smooth'});}catch{}
}

function loadImage(event){
  const file=event.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{ui.formData.imagem=e.target.result;render();};
  r.readAsDataURL(file);
}



function saveTrade(){
  const f=ui.formData,c=CFG();
  const missing=isLiq()?(!f.par||!(f.regioes||[]).length||!(f.gatilhos||[]).length||!f.resultado):(!f.par||!f.setup||!f.resultado);
  if(missing){ui.formErr=isLiq()?'Preencha: ativo, ao menos uma região, ao menos um gatilho e resultado.':'Preencha: par, setup e resultado.';render();return;}
  const parciaisLimpas=(f.saiu_parcial?(f.parciais||[]):[])
    .filter(p=>p.pontos!==''||p.contratos!==''||p.pct!=='')
    .map(p=>({pontos:p.pontos===''?null:Number(p.pontos),contratos:p.contratos===''?null:Number(p.contratos),pct:p.pct===''?null:Number(p.pct)}));
  const trade={...f,parciais:parciaisLimpas,revisado:true,janela:classifyJanela(f.hora_entrada)||f.janela||'',pnl:normPnl(f.resultado,f.pnl),rr_realizado:Number(f.rr_realizado)||null,parcial_pct:f.parcial_pct?Number(f.parcial_pct):null,pontos_stop:f.pontos_stop?Number(f.pontos_stop):null,pontos_gain:f.pontos_gain?Number(f.pontos_gain):null};
  if(ui._editIdx!=null){J().trades[ui._editIdx]=trade;ui._editIdx=null;}
  else{J().trades.unshift(trade);}
  save();
  if(ui._revisao){
    const p=pendentes();
    if(p.length){ui.formData=emptyForm();editTrade(p[0]);return;}
    ui._revisao=false;
  }
  ui.showForm=false;ui.formImg=null;ui.formData=emptyForm();render();
}

function addItem(key){
  const el=document.getElementById('inp_'+key);
  let v=(el?.value||'').trim();
  if(!v)return;
  if(key==='pairs')v=v.toUpperCase();
  const j=J();
  if(!j[key].includes(v)){j[key].push(v);save();render();}
  else{el.value='';}
}
function removeItem(key,i){
  const j=J();
  if(confirm(`Remover "${j[key][i]}"?`)){
    const rm=j[key][i];j[key].splice(i,1);
    if(key==='pairs')j.paused=j.paused.filter(x=>x!==rm);
    save();render();
  }
}
function togglePause(p){
  const j=J();
  j.paused=j.paused.includes(p)?j.paused.filter(x=>x!==p):[...j.paused,p];
  save();render();
}

// ── backup automático
function lerCfgBackup(){
  try{return JSON.parse(localStorage.getItem('zbackup')||'{}');}catch{return{};}
}
function salvarCfgBackup(c){try{localStorage.setItem('zbackup',JSON.stringify(c));}catch{}}
function totalTrades(){return Object.values(journals).reduce((a,x)=>a+(x.trades||[]).length,0);}
function checarBackup(){
  const c=lerCfgBackup();
  if(c.ativo===false)return;
  if(!totalTrades())return;
  const agora=Date.now();
  const ultimo=c.ultimo||0;
  const SEMANA=7*24*60*60*1000;
  if(agora-ultimo<SEMANA)return;
  // primeira vez: só marca a data, para não baixar nada de surpresa
  if(!ultimo){salvarCfgBackup({...c,ultimo:agora});return;}
  ui._backupPend=true;
}
function fazerBackupAuto(){
  exportJ(true);
  salvarCfgBackup({...lerCfgBackup(),ultimo:Date.now()});
  ui._backupPend=false;render();
}
function adiarBackup(){
  salvarCfgBackup({...lerCfgBackup(),ultimo:Date.now()-6*24*60*60*1000});
  ui._backupPend=false;render();
}
function toggleBackupAuto(){
  const c=lerCfgBackup();
  salvarCfgBackup({...c,ativo:c.ativo===false});
  render();
}

function exportJ(auto){
  const b=new Blob([JSON.stringify({journals,activeJournal,version:3},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`${auto?'backup-auto':'diario'}-${today().replace(/\//g,'-')}.json`;a.click();
  if(!auto)salvarCfgBackup({...lerCfgBackup(),ultimo:Date.now()});
}
function importJ(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.journals){Object.keys(JOURNALS).forEach(k=>{if(d.journals[k])journals[k]={...initJournal(k),...d.journals[k]};});}
      else if(d.trades){journals.forex={...initJournal('forex'),trades:d.trades,capital:d.capital||200};}
      save();render();alert('Importado com sucesso!');
    }catch{alert('Arquivo inválido.');}
  };
  r.readAsText(f);
}

function openClaude(){
  const j=J(),c=CFG();
  const s=calcStats(j.trades);
  const resumo=j.trades.slice(0,25).map(t=>{
    const p=[t.data,t.par];
    if((t.regioes||[]).length)p.push(t.regioes.join('+'));
    if((t.gatilhos||[]).length)p.push(t.gatilhos.join('+'));
    if(t.setup)p.push(t.setup);
    const fok=allFiltersOk(t);
    if(fok!==null)p.push(fok?'filtros:OK':`filtros:faltou(${j.filters.filter(x=>!(t.filtros||[]).includes(x)).join('/')})`);
    if((t.confluencias||[]).length)p.push(`confl:${t.confluencias.join('+')}`);
    if(t.janela)p.push(`${t.janela}${t.hora_entrada?' '+t.hora_entrada:''}${duracao(t.hora_entrada,t.hora_saida)?' ('+duracao(t.hora_entrada,t.hora_saida)+')':''}`);
    if(t.pontos_stop&&t.pontos_gain)p.push(`stop:${t.pontos_stop}pts/alvo:${t.pontos_gain}pts(RR1:${rrPlan(t)})`);
    p.push(t.resultado,fmt(t.pnl));
    if(t.saiu_parcial)p.push(`parciais:${(t.parciais||[]).map(x=>`${x.pontos||'?'}pts/${x.contratos||'?'}c`).join('+')||'sim'}`);
    if(t.emocao)p.push(t.emocao);
    if(t.moveu_be_cedo)p.push('BE-cedo');
    if(!t.seguiu_regras)p.push('fora-do-plano');
    return p.join(' | ');
  }).join('\n');

  const op=isLiq()
    ?`OPERACIONAL:
Entro após consumo/captura de liquidez, ou na região de Fibo (50-61%).
Aguardo ativação de pivô no M1 (oculto ou revelado).
Filtros obrigatórios: ${j.filters.join(', ')}.
Confluências que observo: ${j.confluences.join(', ')}.`
    :`Setups: ${j.setups.join(', ')}`;

  const txt=`Contexto do meu diário de trade — ${c.name}:

GESTÃO: ${c.currency}${j.capital} de capital | Risco ${j.riskPct}% = ${fmt(riskPerTrade())} por operação | Paro com ${j.maxConsec} stops ou ${j.maxLossPct}% (${fmt(maxDailyLoss())}) de perda no dia

${op}

ESTATÍSTICAS:
Total: ${j.trades.length} trades | Win Rate: ${s?.winRate??0}% | P&L: ${fmt(s?.totalPnl??0)} | Profit Factor: ${s?.pf??'—'} | RR médio: 1:${s?.avgRR??'—'}

ÚLTIMOS TRADES:
${resumo||'Nenhum trade registrado.'}

---
Com base nesses dados, me ajude a analisar minha performance e identificar padrões.`;

  navigator.clipboard.writeText(txt).then(()=>{
    alert(`Contexto do diário ${c.name} copiado! Cole numa conversa com o Claude.`);
  }).catch(()=>{
    const w=window.open('','_blank');
    if(w)w.document.write(`<pre style="font-family:monospace;padding:20px;background:#111;color:#fff;white-space:pre-wrap">${escHtml(txt)}</pre>`);
  });
}

checkarBackupInit();
render();
